# ---------- Narratives ----------
narratives:
  - id: happy
    title: ハッピーパス — 企画から参加・フィードバックまで
    kind: happy
    entry: 主催者がイベントを下書きする
    prose: |
      ある技術コミュニティの主催者 Takeshi は、月例のミートアップを開きたいと考えていた。
      会場を確保してから参加者を集めるのか、参加意向を先に募ってから会場を決めるのか、
      毎回のように悩み、結果として案内が出る時期が遅れて参加者が集まりきらないことが続いていた。

      新しいミートアップ・プラットフォームでは、Takeshi はまず開催したいテーマと
      おおよその日時・想定定員でイベントを下書きする。公開準備が整った時点で公開操作を行うと、
      コミュニティのメンバーに通知が届き、参加申込が開かれる。各メンバーは自分の予定と
      照らし合わせて申込し、定員内なら確定、定員到達後は繰上待ちに自動でまわる。

      開催が近づくと、システムが 24 時間前と 1 時間前にリマインドを送る。当日、
      参加者は受付で QR コードをかざしてチェックインし、Takeshi の手元には今この瞬間
      会場にいる人数がリアルタイムで見える。終了後、参加者には任意のフィードバック
      フォームが届き、得点と自由記述が集計されて次回の企画に活かされる。
      Takeshi が「とにかく案内を出す」だけの作業から解放され、参加者の体験設計と
      コンテンツ準備に集中できるようになることが、このプラットフォームの目的である。

  - id: alt-waitlist
    title: 代替シナリオ — 定員到達・繰上待ち
    kind: alt
    entry: 参加者がイベントに申込する
    prose: |
      人気テーマのミートアップは公開直後に定員に達する。定員到達後の申込は
      自動で繰上待ち（FIFO）に登録される。確定者がキャンセルした瞬間、
      待ち列の先頭者に席が割り当てられ、通知される。一定時間内に応答がなければ
      次点に移る。Takeshi は満席後も「待っている人数」が見え、追加開催の判断材料にできる。

  - id: alt-cancel
    title: 代替シナリオ — 主催者キャンセル
    kind: alt
    entry: 主催者がイベントをキャンセルする
    prose: |-
      会場トラブルや講師都合でイベントを開催できなくなった場合、Takeshi はキャンセル操作を行う。 システムは確定参加者と繰上待ち全員に同時に「中止しました（理由付き）」と通知する。 Takeshi はキャンセル理由を 1 回入力するだけで、参加者個別の連絡作業から解放される。 別日程への振替は本セッションのスコープ外（公開後の日時変更＝再公開フロー扱い）。

  - id: alt-noshow
    title: 代替シナリオ — 当日 no-show 検知
    kind: alt
    entry: システムが no-show を判定する
    prose: |
      開催開始から 30 分が経過してもチェックインしていない確定参加者は no-show として
      集計される。罰則は設けず、Takeshi の手元に「確定者のうち実出席率」のサマリが
      残るのみ。これにより、次回の定員設計・繰上ポリシーのチューニングに使える。

# ---------- Bounded Contexts ----------
contexts:
  - name: event-planning
    type: FEATURE
    label_ja: イベント企画
    description: |
      イベントの **企画・公開・キャンセル** を主催者の意思で完結させる文脈。
      テーマ・日時・定員・公開状態を持つ Event 集約が中核。
      参加者の動きは参照するが、Event の状態遷移には関与しない。

      - **含むシナリオ**: 下書き / 公開 / キャンセル
      - **目的**: 主催者が「とにかく案内を出す」雑務から解放され、企画作業に集中できること
      - **背景**: 既存ツール（チャット + フォーム + カレンダー）では公開連絡と参加管理が分散
      - **制約**: 公開後の日時変更は再公開フロー扱い（本セッションでは対象外）
    aggs: [Event]
    lang:
      aggs:
        Event: イベント
      actors:
        Organizer: 主催者
      cmds:
        DraftEvent: イベントを下書きする
        PublishEvent: イベントを公開する
        CancelEvent: イベントをキャンセルする
        ConcludeEvent: イベントを終了する
      evts:
        EventDrafted: イベントが下書きされた
        EventPublished: イベントが公開された
        EventCancelled: イベントがキャンセルされた
        EventConcluded: イベントが終了した
      states:
        DRAFT: 下書き
        PUBLISHED: 公開中
        CANCELLED: イベント中止済
        CONCLUDED: 開催終了済
    up: []
    dn:
      - {ctx: participation, rel: Customer-Supplier, roles: [U, OHS], prRoles: [D, CF]}

  - name: participation
    type: FEATURE
    label_ja: 参加申込
    description: |
      イベント単位での **申込・確定・繰上・キャンセル** を扱う文脈。
      Event の公開・キャンセルをシグナルとして受け取り、Participation 集約の
      ライフサイクルを進める。

      - **含むシナリオ**: 申込 / 自動確定 / 繰上 / 参加キャンセル
      - **目的**: 定員管理と公平な繰上を主催者の手作業ナシで実現する
      - **背景**: フォーム + スプレッドシートでは定員到達後の繰上対応が漏れがち
      - **制約**: 定員到達後の申込は自動的に繰上待ち FIFO へ。同一 Event への重複申込は拒否
    aggs: [Participation]
    lang:
      aggs:
        Participation: 参加申込
      actors:
        Member: 参加者
        System: システム
      cmds:
        ApplyForEvent: イベントに申込する
        ConfirmParticipation: 参加を確定する
        PromoteFromWaitlist: 繰上を実行する
        CancelParticipation: 参加をキャンセルする
      evts:
        ParticipationApplied: 申込された
        ParticipationWaitlisted: 繰上待ちに登録された
        ParticipationConfirmed: 参加が確定した
        ParticipationPromoted: 繰上が実行された
        ParticipationCancelled: 参加がキャンセルされた
      pols:
        ConfirmOnApplied: 申込即時確定
        PromoteOnCancelled: キャンセル時繰上
        NotifyParticipantsOnEventCancelled: イベント中止時の参加者通知
      qrys:
        AvailableSeatsForEvent: 残席数
        ActiveParticipationsForEvent: 確定参加者一覧
        WaitlistForEvent: 繰上待ち列
      states:
        APPLIED: 申込済
        CONFIRMED: 確定
        WAITLISTED: 繰上待ち
        CANCELLED: 参加キャンセル済
      vos:
        EventId: イベント ID
        ApplyDeadline: 申込締切
    up:
      - {ctx: event-planning, rel: Customer-Supplier, roles: [D, CF], prRoles: [U, OHS]}
    dn:
      - {ctx: attendance, rel: Customer-Supplier, roles: [U, OHS], prRoles: [D, CF]}

  - name: attendance
    type: FEATURE
    label_ja: 当日出席
    description: |
      開催 **当日** の出席記録を扱う文脈。チェックイン QR・no-show 判定・
      参加者数のリアルタイム可視化を担う。

      - **含むシナリオ**: リマインド送信 / チェックイン / no-show 判定
      - **目的**: 主催者の受付業務をゼロに近づけ、参加体験の改善に集中できること
      - **背景**: 紙の受付名簿は当日のオペ負荷が高く、no-show 集計も翌週送り
      - **制約**: チェックインは開催開始 30 分前から開始 60 分後まで
    aggs: [Attendance]
    lang:
      aggs:
        Attendance: 出席記録
      actors:
        Member: 参加者
        System: システム
      cmds:
        SendReminder: リマインドを送信する
        CheckIn: チェックインする
        DetectNoShow: no-show を判定する
      evts:
        ReminderSent: リマインドが送信された
        ParticipantCheckedIn: 参加者がチェックインした
        AttendanceNoShowDetected: no-show が検知された
      pols:
        ScheduleRemindersOnConfirmed: 確定時リマインド予約
      qrys:
        CurrentAttendanceCount: 現在の出席数
        NoShowRateByEvent: イベント別 no-show 率
      states:
