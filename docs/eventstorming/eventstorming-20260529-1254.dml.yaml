  - name: feedback
    type: FEATURE
    label_ja: フィードバック
    description: |
      開催 **終了後** にフィードバックを収集する文脈。任意提出。

      - **含むシナリオ**: フィードバック送信
      - **目的**: 主催者が次回企画の改善材料を得る
      - **背景**: 既存運用ではアンケート URL を別途配布する手間と回収率低下
      - **制約**: 終了から 72 時間以内のみ受付
    aggs: [Feedback]
    lang:
      aggs:
        Feedback: フィードバック
      actors:
        Member: 参加者
      cmds:
        SubmitFeedback: フィードバックを送信する
      evts:
        FeedbackSubmitted: フィードバックが送信された
      qrys:
        FeedbackSummaryByEvent: イベント別フィードバック集計
