    dn: []

# ---------- Aggregates（フェーズ 5: transitions / attrs / events.params 完成） ----------
aggregates:
  - name: Event
    ctx: event-planning
    purpose: 主催者が公開・キャンセルできる開催単位を一意に表現し、ライフサイクルを保証する
    background: |
      従来の運用では「下書き状態のイベント」と「公開済イベント」がスプレッドシート上で混在し、
      誰がいつ公開操作をしたか追跡できなかった。Event 集約として状態と操作主体を一元化する。
    constraints:
      - 公開後の日時変更は本セッション範囲外（再公開フロー扱い）
      - キャンセル後は再公開不可
      - 定員上限は公開時点で確定（公開後の縮小は禁止）
    states:
      - DRAFT
      - PUBLISHED
      - CANCELLED
      - CONCLUDED
    transitions:
      - {from: DRAFT, to: PUBLISHED, via: PublishEvent, when: 主催者が公開準備を整えた時}
      - {from: PUBLISHED, to: CANCELLED, via: CancelEvent, when: 主催者が中止判断をした時}
      - from: PUBLISHED
        to: CONCLUDED
        via: ConcludeEvent
        when: 主催者が開催終了を宣言した時
    attrs:
      - {name: eventId, type: EventId, required: true}
      - {name: organizerId, type: OrganizerId, required: true}
      - {name: title, type: string, required: true}
      - {name: description, type: string}
      - {name: scheduledAt, type: datetime, required: true}
      - {name: location, type: string}
      - {name: capacity, type: int, required: true, note: 公開時点で確定}
      - {name: applyDeadline, type: datetime, required: true}
      - {name: publishedAt, type: datetime}
      - {name: cancelledAt, type: datetime}
      - {name: cancelReason, type: string}
      - name: concludedAt
        type: datetime
    events:
      - name: EventDrafted
        params:
          - {name: eventId, type: EventId}
          - {name: organizerId, type: OrganizerId}
          - {name: title, type: string}
          - {name: scheduledAt, type: datetime}
      - name: EventPublished
        params:
          - {name: eventId, type: EventId}
          - {name: capacity, type: int}
          - {name: applyDeadline, type: datetime}
          - {name: publishedAt, type: datetime}
      - name: EventCancelled
        params:
          - {name: eventId, type: EventId}
          - {name: cancelReason, type: string}
          - {name: cancelledAt, type: datetime}

      - name: EventConcluded
        params:
          - name: eventId
            type: EventId
          - name: concludedAt
            type: datetime
  - name: Participation
    ctx: participation
    purpose: 1 参加者 1 イベントへの申込状態を保持し、定員と繰上ルールを満たす遷移のみ許す
    background: |
      フォーム送信の重複申込・キャンセル後の手動繰上漏れが運用課題。Participation 集約で
      状態を強制し、定員到達時の自動繰上待ち、キャンセル時の自動繰上を保証する。
    constraints:
      - 同一 Event への同一 Member の重複申込は拒否
      - 繰上待ちは FIFO
      - 繰上通知後一定時間（24 時間）応答なしは次点へ
    states:
      - APPLIED
      - CONFIRMED
      - WAITLISTED
      - CANCELLED
    transitions:
      - from: APPLIED
        to:
          - CONFIRMED
          - WAITLISTED
        via: ApplyForEvent
        when: 申込受領時に定員状況で分岐
      - from: APPLIED
        to: CONFIRMED
        via: ConfirmParticipation
        when: ConfirmOnApplied 起動時
      - from: WAITLISTED
        to: CONFIRMED
        via: PromoteFromWaitlist
        when: 確定者キャンセルで繰上（promotedAt で由来を保持）
      - from: CONFIRMED
        to: CANCELLED
        via: CancelParticipation
        when: 参加者キャンセル or 主催者キャンセル
      - from: WAITLISTED
        to: CANCELLED
        via: CancelParticipation
        when: 繰上待ち中のキャンセル
    attrs:
      - {name: participationId, type: ParticipationId, required: true}
      - {name: eventId, type: EventId, required: true}
      - {name: memberId, type: MemberId, required: true}
      - {name: appliedAt, type: datetime, required: true}
      - {name: confirmedAt, type: datetime}
      - {name: waitlistedAt, type: datetime}
      - {name: waitlistPosition, type: int}
      - {name: promotedAt, type: datetime}
      - {name: cancelledAt, type: datetime}
      - {name: cancelReason, type: string}
    events:
      - name: ParticipationApplied
        params:
          - {name: participationId, type: ParticipationId}
          - {name: eventId, type: EventId}
          - {name: memberId, type: MemberId}
          - {name: appliedAt, type: datetime}
      - name: ParticipationWaitlisted
        params:
          - {name: participationId, type: ParticipationId}
          - {name: eventId, type: EventId}
          - {name: memberId, type: MemberId}
          - {name: waitlistPosition, type: int}
      - name: ParticipationConfirmed
        params:
          - {name: participationId, type: ParticipationId}
          - {name: eventId, type: EventId}
          - {name: memberId, type: MemberId}
          - {name: confirmedAt, type: datetime}
      - name: ParticipationPromoted
        params:
          - {name: participationId, type: ParticipationId}
          - {name: eventId, type: EventId}
          - {name: promotedAt, type: datetime}
      - name: ParticipationCancelled
        params:
          - {name: participationId, type: ParticipationId}
          - {name: eventId, type: EventId}
          - {name: cancelReason, type: string}
          - {name: cancelledAt, type: datetime}

  - name: Attendance
    ctx: attendance
    purpose: 確定参加者が実際に会場に来たか／来なかったかを当日に記録する
    background: |
      紙受付では当日記録と集計のタイムラグが大きく、no-show 率が翌週まで分からなかった。
      Attendance 集約に QR チェックインと自動 no-show 判定を実装し、当日中の見える化を実現する。
    constraints:
      - チェックインは開催開始 30 分前から開始 60 分後まで
      - 開始 30 分後までに未チェックインなら自動 NO_SHOW
      - 一度 CHECKED_IN になったら NO_SHOW へ戻れない
    states: [SCHEDULED, CHECKED_IN, NO_SHOW]
    transitions:
      - {from: SCHEDULED, to: CHECKED_IN, via: CheckIn, when: QR スキャン or 主催者手動}
      - {from: SCHEDULED, to: NO_SHOW, via: DetectNoShow, when: 開始 30 分後の自動判定}
    attrs:
      - {name: attendanceId, type: AttendanceId, required: true}
      - {name: participationId, type: ParticipationId, required: true}
      - {name: eventId, type: EventId, required: true}
      - {name: checkInWindowStart, type: datetime, required: true}
      - {name: checkInWindowEnd, type: datetime, required: true}
      - {name: checkedInAt, type: datetime}
      - {name: noShowDetectedAt, type: datetime}
    events:
      - name: ReminderSent
        params:
          - {name: attendanceId, type: AttendanceId}
          - {name: eventId, type: EventId}
          - {name: reminderType, type: string, note: 24h / 1h}
      - name: ParticipantCheckedIn
        params:
          - {name: attendanceId, type: AttendanceId}
          - {name: eventId, type: EventId}
          - {name: checkedInAt, type: datetime}
      - name: AttendanceNoShowDetected
        params:
          - {name: attendanceId, type: AttendanceId}
          - {name: eventId, type: EventId}
          - {name: noShowDetectedAt, type: datetime}
        terminal: true

  - name: Feedback
    ctx: feedback
    purpose: 開催終了後の任意フィードバック（評点 + 自由記述）を 1 参加者 1 件で保持する
    background: |
      既存運用ではアンケート URL の別配布で回収率が伸びず、改善材料が薄い。
      Feedback 集約として参加者ごとに集約しつつ、提出は任意とする。
    constraints:
      - 終了から 72 時間以内のみ受付
      - 1 参加者 1 Event につき 1 件（初回提出で確定・再送不可）
    states: [PENDING, SUBMITTED]
    transitions:
      - {from: PENDING, to: SUBMITTED, via: SubmitFeedback, when: 参加者が提出フォーム送信時}
    attrs:
      - {name: feedbackId, type: FeedbackId, required: true}
      - {name: eventId, type: EventId, required: true}
      - {name: memberId, type: MemberId, required: true}
      - {name: rating, type: int, note: 1-5}
      - {name: comment, type: string}
      - {name: submittedAt, type: datetime}
      - {name: submissionDeadline, type: datetime, required: true}
    events:
      - name: FeedbackSubmitted
        params:
          - {name: feedbackId, type: FeedbackId}
          - {name: eventId, type: EventId}
          - {name: memberId, type: MemberId}
          - {name: rating, type: int}
          - {name: submittedAt, type: datetime}
        terminal: true

# ---------- Scenarios（フェーズ 5: rules / errs 完成） ----------
scenarios:
  # event-planning
  - name: 主催者がイベントを下書きする
    ctx: event-planning
    actor: Organizer
    cmd: DraftEvent
    evt: EventDrafted
    agg: Event
    next: 主催者がイベントを公開する
    rules:
      - {rule: Event title must be non-empty, why: 公開時に参加者が何のイベントか判別できる必要がある}
      - {rule: scheduledAt must be in the future, why: 過去日付の下書きは運用ミス}
      - {rule: capacity must be positive integer, why: 0 や負数は申込フローが破綻}
    errs:
      - {cond: title が空, err: EventTitleRequired, when: 下書き作成時}
      - {cond: scheduledAt が現在以前, err: EventSchedulePast, when: 下書き作成時}
      - {cond: capacity が 0 以下, err: EventCapacityInvalid, when: 下書き作成時}

  - name: 主催者がイベントを公開する
    ctx: event-planning
    actor: Organizer
    cmd: PublishEvent
    evt: EventPublished
    agg: Event
    next: 参加者がイベントに申込する
    rules:
      - {rule: Only DRAFT events can be published, why: 公開済 / キャンセル済の二重公開を防ぐ}
      - {rule: applyDeadline must be earlier than scheduledAt, why: 開始後の申込は受付不可とする業務ルール}
    errs:
      - {cond: 状態が DRAFT 以外, err: EventNotInDraft, when: 公開操作時}
      - {cond: applyDeadline >= scheduledAt, err: ApplyDeadlineInvalid, when: 申込締切が開催以降では業務的に成立しない}

  - name: 主催者がイベントをキャンセルする
    ctx: event-planning
    actor: Organizer
    cmd: CancelEvent
    evt: EventCancelled
    agg: Event
    rules:
      - {rule: Only PUBLISHED events can be cancelled, why: 下書き状態はそのまま削除可能でキャンセル不要}
      - {rule: cancelReason must be provided, why: 参加者通知に理由を含める必要があるため}
    errs:
      - {cond: 状態が PUBLISHED 以外, err: EventNotPublished, when: キャンセル操作時}
      - {cond: cancelReason が空, err: CancelReasonRequired, when: キャンセル操作時}

  # participation
  - name: 参加者がイベントに申込する
    ctx: participation
    actor: Member
    cmd: ApplyForEvent
    agg: Participation
    brMode: exclusive
    brs:
      - {cond: 定員未達, evt: ParticipationApplied, next: システムが参加を確定する}
      - {cond: 定員到達, evt: ParticipationWaitlisted, terminal: alt-waitlist}
    rules:
      - {rule: Event must be in PUBLISHED state, why: 下書きやキャンセル済イベントへの申込は無効}
      - {rule: Application must be before applyDeadline, why: 締切後申込は業務的に受け付けない}
      - {rule: A member can apply only once per event, why: 重複申込は定員管理を破綻させる}
    errs:
      - cond: Event 状態が PUBLISHED 以外
        err: EventNotOpenForApply
        when: 申込時
      - cond: 現在時刻 > applyDeadline
        err: ApplyDeadlinePassed
        when: 申込時
      - cond: 同一 Member の同一 Event への申込が既に存在
        err: AlreadyApplied
        when: 申込時
  - name: システムが参加を確定する
    ctx: participation
    actor: System
    cmd: ConfirmParticipation
    evt: ParticipationConfirmed
    agg: Participation
    next: システムがリマインドを送信する
    rules:
      - {rule: Participation must be in APPLIED state, why: WAITLISTED や CONFIRMED への二重確定を防ぐ}
      - {rule: Confirmed count must not exceed Event.capacity, why: 並行申込で定員超過するのを防ぐ}
    errs:
      - {cond: Participation 状態が APPLIED 以外, err: ParticipationNotApplied, when: 確定処理時}
      - {cond: 確定処理時点で capacity 到達, err: EventCapacityReached, when: 並行申込で定員超過するエッジケース}

  - name: システムが繰上を実行する
    ctx: participation
    actor: System
    cmd: PromoteFromWaitlist
    evt: ParticipationPromoted
    agg: Participation
    rules:
      - {rule: Promote from WAITLISTED head only, why: FIFO 公平性を保証}
      - {rule: Promotion offer expires 24 hours after notification then promotes next in line, why: 反応のない先頭で繰上が止まらないようにする (D2 採用値 = FIFO + 24h タイムアウト)}
      - {rule: Skip promotion when Event itself is CANCELLED, why: alt-cancel フローで bulk Cancel が走った後の暴発防止 (PromoteOnCancelled ガード)}
    errs:
      - {cond: 繰上対象の WAITLISTED が存在しない, err: NoWaitlistEntry, when: 繰上トリガー時}
      - {cond: 該当 Participation が既に CANCELLED, err: ParticipationAlreadyCancelled, when: 繰上対象選定時}
      - {cond: 対応する Event が CANCELLED, err: EventAlreadyCancelled, when: alt-cancel フロー連鎖中の繰上試行}

  - name: 参加者が参加をキャンセルする
    ctx: participation
    actor: Member
    cmd: CancelParticipation
    evt: ParticipationCancelled
    agg: Participation
    rules:
      - rule: Cancellation allowed from CONFIRMED / WAITLISTED
        why: APPLIED 中の即時取消は ConfirmOnApplied 競合で扱わない
      - rule: Cannot cancel after check-in window opens
        why: 当日キャンセルは no-show 扱いとする業務ルール
    errs:
      - {cond: 既に CANCELLED, err: ParticipationAlreadyCancelled, when: キャンセル操作時}
      - {cond: チェックイン受付開始以降, err: CancellationDeadlinePassed, when: 当日キャンセル試行時}

  # attendance
  - name: システムがリマインドを送信する
    ctx: attendance
    actor: System
    cmd: SendReminder
    evt: ReminderSent
    agg: Attendance
    next: 参加者がチェックインする
    rules:
      - {rule: Reminders sent at 24h and 1h before scheduledAt, why: 直前再周知で出席率を上げる}
      - {rule: Do not send reminder to CANCELLED participations, why: 通知ノイズを避ける}
    errs:
      - {cond: 対応する Participation が CANCELLED, err: ParticipationCancelledForReminder, when: スケジューラ実行時}
      - {cond: 送信時刻が過去, err: ReminderScheduleExpired, when: 遅延ジョブ実行時}

  - name: 参加者がチェックインする
    ctx: attendance
    actor: Member
    cmd: CheckIn
    evt: ParticipantCheckedIn
    agg: Attendance
    next: 主催者がイベントを終了する
    rules:
      - rule: Check-in window is 30min before to 60min after start
        why: 早すぎ / 遅すぎチェックインを排除
      - rule: Only SCHEDULED can be checked in
        why: 既に NO_SHOW のエントリへの再チェックインは矛盾
      - rule: Participation must be CONFIRMED
        why: WAITLISTED や CANCELLED のチェックインを拒否
    errs:
      - cond: checkInWindow 範囲外
        err: CheckInWindowClosed
        when: 当日チェックイン時
      - cond: Attendance 状態が SCHEDULED 以外
        err: AttendanceAlreadyProcessed
        when: 重複チェックインや no-show 後
      - cond: 対応 Participation が CONFIRMED 以外
        err: ParticipationNotEligible
        when: チェックイン試行時
  - name: システムが no-show を判定する
    ctx: attendance
    actor: System
    cmd: DetectNoShow
    evt: AttendanceNoShowDetected
    agg: Attendance
    rules:
      - {rule: Run 30 minutes after scheduledAt, why: 遅刻者の余裕を確保}
      - {rule: Target SCHEDULED entries only, why: CHECKED_IN や既 NO_SHOW を二重処理しない}
    errs:
      - {cond: 判定時刻 < scheduledAt + 30min, err: NoShowDetectionTooEarly, when: 早期判定試行（遅刻者の余裕未確保）}
      - {cond: 該当エントリが SCHEDULED 以外, err: AttendanceAlreadyProcessed, when: 重複起動エッジケース}

  # feedback
  - name: 参加者がフィードバックを送信する
    ctx: feedback
    actor: Member
    cmd: SubmitFeedback
    evt: FeedbackSubmitted
    agg: Feedback
    rules:
      - rule: Submission must be within 72h after EventConcluded
        why: 期間外は次回改善のシグナルとして遅すぎる
      - rule: rating must be 1-5 if provided
        why: スケール外は集計を歪める
      - rule: One feedback per member per event (first wins, resubmit rejected)
        why: 初回提出で確定。再送は拒否し多重提出による集計の歪みを防ぐ
    errs:
      - cond: 提出時刻 > concludedAt + 72h
        err: FeedbackDeadlinePassed
        when: フォーム送信時
      - cond: rating が 1-5 範囲外
        err: FeedbackRatingInvalid
        when: フォーム送信時
      - cond: 対応する Attendance が NO_SHOW
        err: NoShowCannotSubmitFeedback
        when: フォーム送信時
      - cond: 既に SUBMITTED 済
        err: FeedbackAlreadySubmitted
        when: 再送信時
  - name: 主催者がイベントを終了する
    ctx: event-planning
    actor: Organizer
    cmd: ConcludeEvent
    evt: EventConcluded
    agg: Event
    next: 参加者がフィードバックを送信する
    rules:
      - rule: Only PUBLISHED events can be concluded
        why: 下書き/キャンセル済イベントの終了宣言は無意味
      - rule: concludedAt must be at or after scheduledAt
        why: 開始前の終了宣言は運用ミス
    errs:
      - cond: 状態が PUBLISHED 以外
        err: EventNotPublishedForConclude
        when: 終了操作時
      - cond: concludedAt < scheduledAt
        err: ConcludeBeforeStart
        when: 終了操作時
policies:
  - name: ConfirmOnApplied
    ctx: participation
    trg: ParticipationApplied
    cmd: ConfirmParticipation
    evt: ParticipationConfirmed
    agg: Participation

  - name: PromoteOnCancelled
    ctx: participation
    trg: ParticipationCancelled
    cmd: PromoteFromWaitlist
    evt: ParticipationPromoted
    agg: Participation

  - name: ScheduleRemindersOnConfirmed
    ctx: attendance
    trg: ParticipationConfirmed
    cmd: SendReminder
    evt: ReminderSent
    agg: Attendance

  - name: NotifyParticipantsOnEventCancelled
    ctx: participation
    trg: EventCancelled
    bulk: true
    qry: ActiveParticipationsForEvent
    cmd: CancelParticipation
    evt: ParticipationCancelled
    agg: Participation
    note: bulk Cancel が PromoteOnCancelled を連鎖発火しないよう、PromoteFromWaitlist 側に EventAlreadyCancelled ガードを実装

  - name: InviteFeedbackOnConcluded
    ctx: feedback
    trg: EventConcluded
    note: 副作用専用 POLICY。開催終了（Organizer 明示の ConcludeEvent）を受けて確定参加者にフィードバック依頼を送る。実際の提出は Member の自発操作 SubmitFeedback。終了の押し忘れ時は招待が飛ばない（D8 = 明示のみ・自動フォールバックなし）

# ---------- Queries（フェーズ 5: リードモデル候補） ----------
queries:
  - name: AvailableSeatsForEvent
    ctx: participation
    purpose: 申込時の即時判定（残席があれば確定、無ければ繰上待ち）
    users: Member（申込画面）／ApplyForEvent 処理
    sources:
      - Event.capacity
      - Participation（CONFIRMED 件数）
    formula: capacity - count(Participation where state=CONFIRMED and eventId=:eventId)

  - name: ActiveParticipationsForEvent
    ctx: participation
    purpose: BULK 通知用の確定 + 繰上待ち全件リスト（イベントキャンセル時に一括通知へファンアウト）
    users: NotifyParticipantsOnEventCancelled policy
    sources:
      - Participation（CONFIRMED + WAITLISTED）
    formula: SELECT * FROM Participation WHERE eventId=:eventId AND state IN (CONFIRMED, WAITLISTED)

  - name: WaitlistForEvent
    ctx: participation
    purpose: 繰上待ち列の表示（主催者が満席後の追加開催判断材料に使う）
    users: Organizer（運営ダッシュボード）
    sources:
      - Participation（WAITLISTED）
    formula: ORDER BY waitlistPosition ASC

  - name: CurrentAttendanceCount
    ctx: attendance
    purpose: 当日「今この瞬間会場にいる人数」をリアルタイム表示
    users: Organizer（受付モニタ）
    sources:
      - Attendance（CHECKED_IN）
    formula: count(Attendance where state=CHECKED_IN and eventId=:eventId)

  - name: NoShowRateByEvent
    ctx: attendance
    purpose: 過去イベントの no-show 率（次回定員設計・繰上ポリシー調整の判断材料）
    users: Organizer（振り返り）
    sources:
      - Attendance（CHECKED_IN + NO_SHOW）
    formula: count(NO_SHOW) / (count(NO_SHOW) + count(CHECKED_IN))

  - name: FeedbackSummaryByEvent
    ctx: feedback
    purpose: イベント別フィードバック集計（平均評点・提出率・自由記述抜粋）
    users: Organizer（振り返り）
    sources:
      - Feedback
      - Participation（提出率算出に CONFIRMED 数も使う）
    formula: avg(rating), count(SUBMITTED) / count(eligible)

# ---------- Decisions（フェーズ 6: 意思決定ログ 7 件） ----------
decisions:
  - id: D1
    topic: 課金モデル
    chosen: free-with-optional-paid
    options:
      - name: free-with-optional-paid
        label: 無料 + オプション課金（採用）
        adopted: true
        why: コミュニティの裾野を広げることが本サービスの主目的。完全有料は技術勉強会の文化に逆行する
      - name: all-paid
        label: 全イベント有料
        adopted: false
        why_not: 無料勉強会主体の Takeshi のような主催者層を取り込めず、市場規模が縮む
      - name: all-free
        label: 全イベント無料
        adopted: false
        why_not: 設備費・配信費が必要な大型イベントが運営できず、上限が低くなる
      - name: organizer-charged
        label: 主催者課金（参加者は無料）
        adopted: false
        why_not: 主催者の負担が増えコミュニティ立ち上げの障壁になる
    affects: [Event, Participation]

  - id: D2
    topic: 繰上待ち戦略
    chosen: fifo-with-timeout
    options:
      - name: fifo-with-timeout
        label: FIFO + 24h 応答待ち（採用）
        adopted: true
        why: 公平性（先着順）と運用効率（応答なしで次点へ）を両立。実装も単純で説明しやすい
      - name: random-lottery
        label: 抽選
        adopted: false
        why_not: 早く申し込んだ人の機会損失感が大きく、初期コミュニティでは継続意欲を削ぐ
      - name: organizer-manual
        label: 主催者手動選定
        adopted: false
        why_not: 主催者の運営負荷を増やす（本サービスの目的に逆行）
      - name: broadcast-invite
        label: 一斉招待（早押し）
        adopted: false
        why_not: 通知タイミングへの不公平感が大きく、深夜などのケースで参加機会が偏る
    affects: [Participation, PromoteOnCancelled]

  - id: D3
    topic: no-show 罰則
    chosen: aggregate-only
    options:
      - name: aggregate-only
        label: 集計のみ罰則なし（採用）
        adopted: true
        why: コミュニティの心理的安全性を優先。データは振り返りに使い、罰則は主催者の判断に委ねる
      - name: reputation-score
        label: 評判スコア
        adopted: false
        why_not: コミュニティ志向のサービスで「点数」を導入するとカルチャーが変質する
      - name: temporary-ban
        label: 一定期間の利用停止
        adopted: false
        why_not: 急用での欠席が珍しくないコミュニティ参加で過剰罰則
      - name: cancellation-fee
        label: キャンセル料課金
        adopted: false
        why_not: 無料前提のモデルでは決済導入のオーバーヘッドが大きい
    affects: [Attendance]

  - id: D4
    topic: チェックイン方式
    chosen: qr-with-manual-fallback
    options:
      - name: qr-with-manual-fallback
        label: QR コード + 主催者手動補正可（採用）
        adopted: true
        why: 受付の自動化と例外対応の両立。QR 表示エラー時も主催者が手動でチェック可能
      - name: organizer-rollcall
        label: 主催者点呼
        adopted: false
        why_not: 主催者の運営負荷を増やす（本サービスの目的に逆行）
      - name: self-declaration
        label: 自己申告のみ
        adopted: false
        why_not: 検証性に欠け、no-show 集計の信頼性が下がる
      - name: geolocation
        label: 位置情報判定
        adopted: false
        why_not: プライバシー懸念とオフライン会場での精度問題（地下・室内）が大きい
    affects: [Attendance, ParticipantCheckedIn]

  - id: D5
    topic: リマインド頻度
    chosen: 24h-and-1h
    options:
      - name: 24h-and-1h
        label: 24 時間前 + 1 時間前（採用）
        adopted: true
        why: 翌日予定の認知 + 直前の最終確認の 2 段階で、出席率向上に経験的に効果がある
      - name: 24h-only
        label: 24 時間前のみ
        adopted: false
        why_not: 直前確認がなく、当日の no-show 率が上がる
      - name: 7d-and-24h-and-1h
        label: 1 週間前 + 24h + 1h（3 回）
        adopted: false
        why_not: 通知過多でユーザー離脱リスク。OFF にされると効果ゼロ
      - name: none
        label: リマインドなし
        adopted: false
        why_not: 出席率低下は明白で、本サービスの価値提供（運営自動化）から逆行
    affects: [Attendance, ScheduleRemindersOnConfirmed]

  - id: D6
    topic: フィードバック必須度
    chosen: optional
    options:
      - name: optional
        label: 任意（採用）
        adopted: true
        why: 心理的負担を最小化し、書きたい人のリッチな声を集める方針。提出率より質を重視
      - name: required
        label: 必須
        adopted: false
        why_not: 強制感が次回参加意欲を下げ、書き殴り化で質も下がる
      - name: strong-nudge
        label: 強い催促
        adopted: false
        why_not: 通知過多と催促文面の調整負荷が大きい割に提出率向上は限定的
    affects: [Feedback]

  - id: D7
    topic: 申込締切のデフォルト設定
    chosen: 1h-before-start
    options:
      - name: 1h-before-start
        label: 開始 1 時間前まで（採用）
        adopted: true
        why: 直前判断派のメンバーを取りこぼさず、当日運営側にも 1 時間の準備バッファを確保
      - name: until-start
        label: 開始まで申込可
        adopted: false
        why_not: 当日運営の人数確定タイミングが取れず、受付資料の用意もしづらい
      - name: 24h-before-start
        label: 24 時間前まで
        adopted: false
        why_not: 直前参加判断派を取りこぼし、コミュニティイベントの実情と合わない
      - name: organizer-set
        label: 主催者が個別設定
        adopted: false
        why_not: 設定 UI と説明文書のコストが増え、MVP には早すぎる
    affects: [Event, Participation]
  - id: D8
    topic: 開催終了（EventConcluded）のモデル化とフィードバック招待トリガー
    chosen: explicit-conclude-no-fallback
    options:
      - name: explicit-conclude-no-fallback
        label: Organizer 明示の ConcludeEvent・押し忘れ救済なし（採用）
        adopted: true
        why: 終了の責任所在を主催者に明確化し、EventConcluded を feedback 招待 trg と提出締切起点（concludedAt+72h）に統一。no-show は開催進行中の判定のため時刻トリガー（DetectNoShow）に据え置く。押し忘れ時の feedback 不送出は Organizer 自己責任とし MVP では自動フォールバックを持たない
      - name: time-based-auto-conclude
        label: scheduledAt 経過で System が自動 conclude
        adopted: false
        why_not: 終了の意思決定者が不在になり延長戦・繰上終了を表現できず、責任所在も曖昧
      - name: explicit-with-fallback
        label: 明示優先＋時刻フォールバックで自動 conclude
        adopted: false
        why_not: ズレが起きない前提では冗長。二重トリガーで EventConcluded 重複発火の複雑性を MVP に持ち込む
    affects:
      - Event
      - Feedback
      - InviteFeedbackOnConcluded

# ---------- Questions（フェーズ 6: closed 紐付け） ----------
  - id: D9
    topic: イベントキャンセル時の振替希望収集のスコープ
    chosen: out-of-scope
    options:
      - name: out-of-scope
        label: 振替希望の収集ごとスコープ外（採用）
        adopted: true
        why: 公開後の日時変更＝再公開は本セッション対象外で振替先イベントを生成できない。行き先のないデータ収集は UX の不実。キャンセル通知は中止理由の一方向通知に留める
      - name: intent-only
        label: 希望表明だけ MVP・行き先は将来
        adopted: false
        why_not: 意向データを集めても主催者が手動で次回を立てるまで活用できず MVP では宙に浮く
      - name: full-transfer
        label: 振替を集約・コマンドで本格モデル化
        adopted: false
        why_not: 再公開対象外の決定を覆し MVP には重い
    affects:
      - NotifyParticipantsOnEventCancelled
  - id: D10
    topic: フィードバック集計の公開範囲
    chosen: organizer-only
    options:
      - name: organizer-only
        label: 主催者専用（採用）
        adopted: true
        why: 公開すると本音が痩せ D6 の質重視に反する。MVP では本音の質を最優先し参加者には非公開。透明性は主催者が改善を反映する行動で示す
      - name: aggregate-public
        label: 匿名集計のみ参加者公開
        adopted: false
        why_not: 折衷だが読みモデルの集計用/個票用分離が必要で MVP には早い
      - name: full-public
        label: 個票含め全公開
        adopted: false
        why_not: 透明性は最大だが自由記述の本音が最も痩せる
    affects:
      - Feedback
      - FeedbackSummaryByEvent
questions:
  - id: Q1
    topic: 課金モデルをどうするか
    why: 全体アーキテクチャと運用体制（決済 BC の要否）に影響する
    status: closed
    decision_id: D1
  - id: Q2
    topic: 繰上待ち戦略の公平性ルール
    why: 参加者体験とコミュニティ文化に直結
    status: closed
    decision_id: D2
  - id: Q3
    topic: no-show 罰則の有無
    why: コミュニティの心理的安全性に直結。誤った設計はユーザー離脱を招く
    status: closed
