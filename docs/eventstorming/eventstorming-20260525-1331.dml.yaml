# yaml-language-server: $schema=../../.claude/skills/eventstorming-facilitator/references/dml.schema.yaml
# DML — ミップカメラ 下取り可能オンラインストア（下取り交換 + ポイント優遇）
# §3 フロー DSL（ハッピーパス + Alt-1〜9）と §10 用語集から生成。
# [?] は推測で埋めず残した設計判断（チャットのホットスポット H1〜H3 参照）。

domains:
  - name: mippcamera-store
    vision: "下取り交換とポイント優遇を購入導線に統合したカメラ EC の体験"
    subs:
      - name: trade-in-core
        type: CORE_DOMAIN
        vision: "申告→概算→受領→本査定→承認/取消の下取り交換。競合との差別化の中核"
      - name: loyalty-program
        type: CORE_DOMAIN
        vision: "下取り利用・キャンペーンによるポイント優遇。リピート促進の中核価値"
      - name: purchasing
        type: SUPPORTING_DOMAIN
        vision: "カート→注文→購入確定→在庫引当→残金決済→発送の購入導線"

ctxs:
  - name: store-front
    type: FEATURE
    vision: "購入注文のライフサイクル（カート〜注文〜購入確定〜在庫〜残金決済〜発送）を所有する"
    resp: [Cart, Order, Inventory, Payment, Shipment]
    sub: purchasing
    lang:
      Order: "下取り充当・ポイント充当を含む購入注文"
      Balance: "購入額から下取り額と使用ポイントを差し引いた残金"
    mod: store-front
    up:
      - ctx: trade-in
        rel: Partnership
        note: "注文確定で集荷を手配、査定承認で購入確定を相互にイベント連携"
      - ctx: loyalty
        rel: Customer-Supplier
        note: "注文時にポイント残高を参照し、確定後にポイント消費/付与を駆動"
    dn: []
    aggs:
      - name: Cart
        purpose: "購入前の商品選択を保持するカート"
        states: [ACTIVE, CHECKED_OUT]
      - name: Order
        purpose: "下取り・ポイントを含む購入注文のライフサイクルの単一の真実源"
        states: [PLACED, PURCHASE_CONFIRMED, COMPLETED, CANCELLED]
      - name: Inventory
        purpose: "購入確定時の在庫引当・解放を管理"
        states: [AVAILABLE, ALLOCATED, RELEASED]
      - name: Payment
        purpose: "残金決済の状態（保留→成功/失敗）を管理"
        states: [PENDING, SETTLED, FAILED]

  - name: trade-in
    type: FEATURE
    vision: "下取り品の申告・概算見積もり・受領・本査定・承認/取消のライフサイクルを所有する"
    resp: [TradeIn, Appraisal]
    sub: trade-in-core
    lang:
      Estimate: "申告内容に基づく概算下取り額（有効期限つき）"
      Appraisal: "受領した下取り品の実機査定（本査定額の確定）"
    mod: trade-in
    up: []
    dn:
      - ctx: store-front
        rel: Partnership
        note: "注文確定を契機に集荷手配、査定承認を契機に購入確定を駆動"
    aggs:
      - name: TradeIn
        purpose: "下取り品の交換プロセス（概算→発送→受領→承認/取消）の単一の真実源"
        states: [ESTIMATED, KIT_SHIPPED, ITEM_SHIPPED, RECEIVED, APPROVED, CANCELLED, EXPIRED, TIMED_OUT, RETURNED]
      - name: Appraisal
        purpose: "受領後の本査定の状態（査定→差異/一致→承認）の単一の真実源"
        states: [PENDING, COMPLETED, DISCREPANCY, REVISED, APPROVED]

  - name: loyalty
    type: FEATURE
    vision: "ポイントの消費・付与とキャンペーン優遇を所有する"
    resp: [PointAccount, Campaign]
    sub: loyalty-program
    lang:
      Points: "1 ポイント = 1 円相当の優遇通貨"
      Campaign: "期間限定のポイント優遇施策"
      BonusRate: "下取り利用優遇(+10%)・キャンペーン(+5%) を積算した付与率"
    mod: loyalty
    up: []
    dn:
      - ctx: store-front
        rel: Customer-Supplier
        note: "在庫引当・発送イベントを契機にポイント消費/付与を実行"
    aggs:
      - name: PointAccount
        purpose: "顧客のポイント残高と消費・付与・返戻の単一の真実源"
      - name: Campaign
        purpose: "ポイント優遇キャンペーンの期間とライフサイクル"
        states: [SCHEDULED, ACTIVE, ENDED]

scs:
  # ---------- store-front ----------
  - name: 客が商品をカートに入れる
    ctx: store-front
    actor: Customer
    cmd: AddItemToCart
    evt: ItemAddedToCart
    agg: Cart

  - name: 客が下取り付きで注文する
    ctx: store-front
    actor: Customer
    qry:
      - GetTradeInEstimate
      - GetPointBalance
    cmd: PlaceOrderWithTradeIn
    evt: OrderPlaced
    agg: Order
    rules:
      - rule: trade-in estimate must be within its validity period
        why: "失効した概算額での充当を防ぐため（Alt-5）"
      - rule: used points must not exceed the customer's point balance
        why: "残高を超えるポイント充当を防ぐため"
      - rule: purchased item must not ship until purchase is confirmed
        why: "下取り承認前の発送（先出し）を防ぐため"
    errs:
      - cond: estimateExpired
        err: TradeInEstimateExpiredError
        when: "概算見積もりの有効期限切れ"
      - cond: insufficientPoints
        err: InsufficientPointBalanceError
        when: "使用指定ポイントが残高を超過"
    pol:
      - TradeInPickupArrangement

  - name: システムが購入を確定する
    ctx: store-front
    actor: System
    cmd: ConfirmPurchase
    evt: PurchaseConfirmed
    agg: Order
    rules:
      - rule: appraisal must be approved before purchase confirmation
        why: "下取り承認を前提に残金が確定するため"
      - rule: order must be in PLACED state
        why: "二重確定を防ぐため"
    errs:
      - cond: orderNotPlaced
        err: InvalidOrderStateError
        when: "注文が PLACED 以外の状態"
    pol:
      - InventoryAllocationOnPurchaseConfirmed

  - name: システムが在庫を引き当てる
    ctx: store-front
    actor: System
    cmd: AllocateInventory
    agg: Inventory
    brMode: exclusive
    brs:
      - cond: "availableStock >= 1"
        evt: InventoryAllocated
        pol: PointConsumptionTrigger
      - cond: "availableStock < 1"
        evt: InventoryAllocationFailed
        pol: OrderCancellationOnInventoryShortage
    rules:
      - rule: allocated quantity must not exceed available stock
        why: "在庫を超える引当を防ぐため（Alt-7）"

  - name: システムが残金を決済する
    ctx: store-front
    actor: System
    qry:
      - GetOutstandingBalance
    cmd: SettleBalance
    agg: Payment
    brMode: exclusive
    brs:
      - cond: "card authorization succeeds"
        evt: BalanceSettled
      - cond: "card authorization fails"
        evt: BalanceSettlementFailed
        pol: CompensationOnBalanceFailure
    rules:
      - rule: settled amount equals purchase price minus trade-in value minus used points
        why: "下取り・ポイント充当後の残金のみを課金するため"

  - name: 発送スタッフが商品を発送する
    ctx: store-front
    actor: ShippingStaff
    cmd: ShipPurchasedItem
    evt: PurchasedItemShipped
    agg: Order
    pol:
      - TradeInBonusPointGrant
      - CampaignBonusPointGrant
    note: "[?] H2: 下取り利用版(TradeInBonusPointGrant)とキャンペーンのみ版(CampaignBonusPointGrant)が同一 EVT(PurchasedItemShipped) を契機にしており、下取り有無での出し分けが EVT だけでは決まらない"

  - name: システムが注文をキャンセルする
    ctx: store-front
    actor: System
    cmd: CancelOrder
    evt: OrderCancelled
    agg: Order
    rules:
      - rule: completed orders must not be cancelled
        why: "発送済み注文の取消による不整合を防ぐため"

  - name: システムが在庫を解放する
    ctx: store-front
    actor: System
    cmd: ReleaseInventory
    evt: InventoryReleased
    agg: Inventory
    pol:
      - OrderCancellationOnInventoryRelease
    note: "Alt-8 補償：残金決済失敗→ポイント返戻後に在庫を解放し注文取消へ繋ぐ"

  # ---------- trade-in ----------
  - name: 客が下取り品を申告する
    ctx: trade-in
    actor: Customer
    cmd: DeclareTradeInItem
    evt: TradeInEstimateProvided
    agg: TradeIn
    rules:
      - rule: declared model must be eligible for trade-in
        why: "対象外機種の概算提示を防ぐため"
    errs:
      - cond: modelNotEligible
        err: TradeInNotEligibleError
        when: "申告機種が下取り対象外"
    pol:
      - QuoteExpiryWatchdog

  - name: 発送スタッフが集荷キットを発送する
    ctx: trade-in
    actor: ShippingStaff
    cmd: ShipPickupKit
    evt: PickupKitShipped
    agg: TradeIn
    pol:
      - TradeInShipmentWatchdog

  - name: 客が下取り品を発送する
    ctx: trade-in
    actor: Customer
    cmd: ShipTradeInItem
    evt: TradeInItemShipped
    agg: TradeIn

  - name: 査定担当が下取り品を受領する
    ctx: trade-in
    actor: Appraiser
    cmd: ReceiveTradeInItem
    evt: TradeInItemReceived
    agg: TradeIn

  - name: 査定担当が本査定を実施する
    ctx: trade-in
    actor: Appraiser
    cmd: PerformAppraisal
    agg: Appraisal
    brMode: exclusive
    brs:
      - cond: "実機が申告どおり（概算=本査定）"
        evt: AppraisalCompleted
        pol: AppraisalResultNotification
      - cond: "実機が申告と相違（差異あり）"
        evt: AppraisalDiscrepancyDetected
        pol: DiscrepancyNotification
    rules:
      - rule: appraisal can be performed only after the item is received
        why: "未受領での査定確定を防ぐため"

  - name: システムが査定承認を依頼する
    ctx: trade-in
    actor: System
    cmd: RequestAppraisalApproval
    evt: ApprovalRequested
    agg: Appraisal

  - name: 客が査定を承認する
    ctx: trade-in
    actor: Customer
    cmd: ApproveAppraisal
    evt: AppraisalApproved
    agg: Appraisal
    rules:
      - rule: appraisal must be in COMPLETED state to be approved
        why: "差異が未解消の査定を承認させ、後続の購入確定が破綻するのを防ぐため"
    pol:
      - PurchaseConfirmationOnApproval
    note: "概算=本査定（差異なし）の承認"

  - name: システムが再見積もりを提示する
    ctx: trade-in
    actor: System
    cmd: PresentRevisedQuote
    evt: RevisedQuotePresented
    agg: Appraisal
    note: "Alt-1〜3：差異検知後に減額後の額を提示"

  - name: 客が減額を承認する
    ctx: trade-in
    actor: Customer
    cmd: ApproveReducedAppraisal
    evt: AppraisalApproved
    agg: Appraisal
    pol:
      - PurchaseConfirmationOnApproval
    note: "Alt-1：再見積もり額で承認し購入確定へ"

  - name: 客が下取りをキャンセルする
    ctx: trade-in
    actor: Customer
    cmd: CancelTradeIn
    evt: TradeInCancelled
    agg: TradeIn
    pol:
      - OrderCancellationOnTradeInCancel
    note: "[?] H1: Alt-2（全体取消）。Alt-3 の CancelTradeInOnly と同一 EVT(TradeInCancelled) を発火するため、注文取消(Alt-2)と購入続行(Alt-3)の後続ポリシー routing が EVT だけでは区別できない"

  - name: 客が下取りのみキャンセルする
    ctx: trade-in
    actor: Customer
    cmd: CancelTradeInOnly
    evt: TradeInCancelled
    agg: TradeIn
    pol:
      - PurchaseWithoutTradeIn
    note: "[?] H1: Alt-3（購入は全額決済で続行）。上の CancelTradeIn と同一 EVT のため要区別（別 EVT 化 or ペイロードフラグ）"

  - name: 発送スタッフが下取り品を返送する
    ctx: trade-in
    actor: ShippingStaff
    cmd: ReturnTradeInItem
    evt: TradeInItemReturned
    agg: TradeIn
    note: "送料は客負担（Alt-2/3）"

  - name: システムが見積もりを失効させる
    ctx: trade-in
    actor: System
    cmd: ExpireQuote
    evt: TradeInQuoteExpired
    agg: TradeIn
    note: "Alt-5：概算提示から所定時間（例 24h）超過で失効"

  - name: システムが下取りを打ち切る
    ctx: trade-in
    actor: System
    cmd: TerminateTradeIn
    evt: TradeInShipmentTimedOut
    agg: TradeIn
    pol:
      - OrderCancellationOnTradeInTimeout
    note: "Alt-6：集荷キット発送から猶予（例 14 日）超過で打ち切り"

  # ---------- loyalty ----------
  - name: システムがポイントを消費する
    ctx: loyalty
    actor: System
    cmd: ConsumePoints
    evt: PointsConsumed
    agg: PointAccount
    rules:
      - rule: consumed points must not exceed the current balance
        why: "残高を超える消費を防ぐため"
    pol:
      - BalanceSettlementTrigger
    note: "注文時に客が指定した使用ポイント分を引き落とす"

  - name: システムがポイントを付与する
    ctx: loyalty
    actor: System
    qry:
      - GetApplicableBonusRate
    cmd: GrantPoints
    evt: PointsGranted
    agg: PointAccount
    rules:
      - rule: bonus rate is the sum of trade-in bonus (+10%) and active campaign bonus (+5%)
        why: "下取り利用とキャンペーンの優遇を積算して付与するため"
    note: "Alt-4：キャンペーン期間外なら +5% を加算しない"

  - name: システムがポイントを返戻する
    ctx: loyalty
    actor: System
    cmd: RefundPoints
    evt: PointsRefunded
    agg: PointAccount
    pol:
      - InventoryReleaseTrigger
    note: "Alt-8 補償：残金決済失敗時に消費済みポイントを返戻"

  - name: マーケティング担当がキャンペーンを開始する
    ctx: loyalty
    actor: MarketingStaff
    cmd: StartCampaign
    evt: CampaignStarted
    agg: Campaign
    pol:
      - CampaignEndWatchdog

  - name: システムがキャンペーンを終了する
    ctx: loyalty
    actor: System
    cmd: EndCampaign
    evt: CampaignEnded
    agg: Campaign
    note: "Alt-9：期間終了時刻に到達で終了"

pols:
  - name: TradeInPickupArrangement
    ctx: trade-in
    trg: OrderPlaced
    cmd: ShipPickupKit
    note: "注文受付を契機に集荷キット発送を手配"

  - name: InventoryAllocationOnPurchaseConfirmed
    ctx: store-front
    trg: PurchaseConfirmed
    cmd: AllocateInventory
    note: "[?] H3: フロー DSL の同期継続（購入確定→在庫引当）を接続するため追加（用語集 §10 にも登録済み）。SAME-TX とすべきか別 TX かは要確認"

  - name: PointConsumptionTrigger
    ctx: loyalty
    trg: InventoryAllocated
    cmd: ConsumePoints
    note: "在庫引当成功を契機に使用ポイントを消費"

  - name: BalanceSettlementTrigger
    ctx: store-front
    trg: PointsConsumed
    cmd: SettleBalance
    note: "ポイント消費後に残金を決済"

  - name: CompensationOnBalanceFailure
    ctx: loyalty
    trg: BalanceSettlementFailed
    cmd: RefundPoints
    note: "Alt-8：残金決済失敗で消費ポイントを返戻"

  - name: InventoryReleaseTrigger
    ctx: store-front
    trg: PointsRefunded
    cmd: ReleaseInventory
    note: "Alt-8：ポイント返戻後に在庫を解放"

  - name: OrderCancellationOnInventoryRelease
    ctx: store-front
    trg: InventoryReleased
    cmd: CancelOrder
    note: "[?] H3: Alt-8 補償の同期継続（在庫解放→注文取消）を接続するため追加（用語集 §10 にも登録済み）"

  - name: OrderCancellationOnInventoryShortage
    ctx: store-front
    trg: InventoryAllocationFailed
    cmd: CancelOrder
    note: "Alt-7：在庫不足で注文取消（残金決済・ポイント消費は未実行）"

  - name: AppraisalResultNotification
    ctx: trade-in
    trg: AppraisalCompleted
    cmd: RequestAppraisalApproval
    note: "本査定完了（差異なし）を客に通知し承認を依頼"

  - name: DiscrepancyNotification
    ctx: trade-in
    trg: AppraisalDiscrepancyDetected
    cmd: PresentRevisedQuote
    note: "Alt-1〜3：差異検知で再見積もりを提示"

  - name: PurchaseConfirmationOnApproval
    ctx: store-front
    trg: AppraisalApproved
    cmd: ConfirmPurchase
    note: "査定承認を契機に購入確定"

  - name: OrderCancellationOnTradeInCancel
    ctx: store-front
    trg: TradeInCancelled
    cmd: CancelOrder
    note: "[?] H1: Alt-2（全体取消）。PurchaseWithoutTradeIn と同一 trigger(TradeInCancelled) のため、購入続行(Alt-3)との区別が EVT だけでは付かない"

  - name: PurchaseWithoutTradeIn
    ctx: store-front
    trg: TradeInCancelled
    cmd: ConfirmPurchase
    note: "[?] H1: Alt-3（下取り充当なしで全額購入確定）。OrderCancellationOnTradeInCancel と同一 trigger のため要区別"

  - name: TradeInBonusPointGrant
    ctx: loyalty
    trg: PurchasedItemShipped
    cmd: GrantPoints
    note: "[?] H2: 下取り利用優遇 +10%（キャンペーン期間内なら +5% も加算）。CampaignBonusPointGrant と同一 trigger のため下取り有無で出し分けが必要"

  - name: CampaignBonusPointGrant
    ctx: loyalty
    trg: PurchasedItemShipped
    cmd: GrantPoints
    note: "[?] H2: Alt-3（下取りなし）でキャンペーン分のみ付与。TradeInBonusPointGrant と同一 trigger のため要区別"

  - name: OrderCancellationOnTradeInTimeout
    ctx: store-front
    trg: TradeInShipmentTimedOut
    cmd: CancelOrder
    note: "Alt-6：下取り打ち切りに連動して注文取消"

  - name: QuoteExpiryWatchdog
    ctx: trade-in
    trg: TradeInEstimateProvided
    cmd: ExpireQuote
    note: "Alt-5：概算提示を起点に有効期限（例 24h）を監視し、超過で失効させるタイマー"

  - name: TradeInShipmentWatchdog
    ctx: trade-in
    trg: PickupKitShipped
    cmd: TerminateTradeIn
    note: "Alt-6：集荷キット発送を起点に発送猶予（例 14 日）を監視し、超過で打ち切るタイマー"

  - name: CampaignEndWatchdog
    ctx: loyalty
    trg: CampaignStarted
    cmd: EndCampaign
    note: "Alt-9：キャンペーン開始を起点に期間終了時刻を監視し、到達で終了させるタイマー"
