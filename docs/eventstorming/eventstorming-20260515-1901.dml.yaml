ctxs:
- name: community
  lang:
    Community: コミュニティの永続的なグループ（メンバー・主催者・公開設定）
    Membership: メンバーがコミュニティに属している状態
  mod: community
  up: []
  dn: []
  aggs:
  - Community
  note: Ticket がメンバー状態をスナップショット保持するため伝播不要
- name: event-planning
  lang:
    Event: 単発の開催単位（タイトル・日時・会場・定員・料金）
    Capacity: 会場枠とオンライン枠の独立管理単位
  mod: event-planning
  up:
  - ctx: community
    rel: Customer-Supplier
  dn:
  - ctx: registration
    rel: Customer-Supplier
  - ctx: ticketing
    rel: Customer-Supplier
  - ctx: attendance
    rel: Customer-Supplier
  aggs:
  - Event
- name: registration
  lang:
    Application: 参加申込の状態を保持するエンティティ
    Waitlist: participationType 単位のキャンセル待ち順序付きキュー
  mod: registration
  up:
  - ctx: event-planning
    rel: Customer-Supplier
  dn:
  - ctx: ticketing
    rel: Customer-Supplier
  aggs:
  - Application
- name: ticketing
  lang:
    Ticket: 確定参加権の証憑（priceSnapshot, memberAtPurchase 凍結）
    Payment: 外部決済の試行記録
    Refund: 返金の試行記録
  mod: ticketing
  up:
  - ctx: event-planning
    rel: Customer-Supplier
    note: 料金参照
  - ctx: registration
    rel: Customer-Supplier
    note: ApplicationSubmitted 受信
  dn:
  - ctx: registration
    rel: Customer-Supplier
    note: 確定/キャンセル完了を逆方向通知
  - ctx: attendance
    rel: Customer-Supplier
    note: Ticket 参照
  aggs:
  - Payment
  - Refund
  - Ticket
- name: attendance
  lang:
    Attendance: 当日の参加確認記録（会場 or オンライン）
    CheckIn: 会場チェックイン
    OnlineJoin: オンライン参加記録
  mod: attendance
  up:
  - ctx: ticketing
    rel: Customer-Supplier
  - ctx: event-planning
    rel: Customer-Supplier
  dn: []
  aggs:
  - Attendance
aggs:
- name: Community
  ctx: community
  purpose: コミュニティの永続的なグループ（メンバー・主催者・公開設定）の単一の真実源
  states:
  - DRAFT
  - PUBLISHED
  - ARCHIVED
  attrs:
  - name: id
    type: CommunityId
    required: true
  - name: name
    type: string
    required: true
    note: 1-100 chars, system-wide unique
  - name: description
    type: string
    required: true
    note: 1-2000 chars
  - name: ownerId
    type: MemberId
    required: true
  - name: status
    type: string
    required: true
    note: DRAFT / PUBLISHED / ARCHIVED
  - name: members
    type: MemberId[]
    required: true
  - name: createdAt
    type: date
    required: true
- name: Event
  ctx: event-planning
  purpose: イベントのライフサイクル（企画→公開→変更/中止→完了）とキャパシティの単一の真実源
  states:
  - DRAFT
  - PUBLISHED
  - CANCELLATION_REQUESTED
  - CANCELLED
  - COMPLETED
  attrs:
  - name: id
    type: EventId
    required: true
  - name: communityId
    type: CommunityId
    required: true
  - name: title
    type: string
    required: true
    note: 1-200 chars
  - name: description
    type: string
    required: true
    note: max 5000 chars
  - name: startDateTime
    type: date
    required: true
  - name: endDateTime
    type: date
    required: true
  - name: venueName
    type: string
    required: false
  - name: venueAddress
    type: string
    required: false
  - name: venueCapacity
    type: int
    required: true
    note: non-negative
  - name: onlineCapacity
    type: int
    required: true
    note: non-negative
  - name: streamUrl
    type: string
    required: false
    note: URL
  - name: memberPrice
    type: Price
    required: true
  - name: generalPrice
    type: Price
    required: true
  - name: status
    type: string
    required: true
    note: DRAFT / PUBLISHED / CANCELLATION_REQUESTED / CANCELLED / COMPLETED
  - name: createdAt
    type: date
    required: true
- name: Application
  ctx: registration
  purpose: 参加申込の状態機械（申込→確定→キャンセル/期限切れ）とキャンセル待ち順序の単一の真実源
  states:
  - APPLIED
  - CONFIRMED
  - WAITLISTED
  - PROMOTED
  - PENDING_RECONFIRMATION
  - CANCELLATION_REQUESTED
  - CANCELLED
  - EXPIRED
  attrs:
  - name: id
    type: ApplicationId
    required: true
  - name: eventId
    type: EventId
    required: true
  - name: memberId
    type: MemberId
    required: true
  - name: participationType
    type: string
    required: true
    note: VENUE / ONLINE
  - name: status
    type: string
    required: true
    note: APPLIED / CONFIRMED / WAITLISTED / PROMOTED / PENDING_RECONFIRMATION / CANCELLATION_REQUESTED / CANCELLED / EXPIRED
  - name: paymentDeadline
    type: date
    required: false
    note: APPLIED / PROMOTED のみ非 null（24h 後）
  - name: waitlistPosition
    type: int
    required: false
    note: WAITLISTED のみ非 null（positive）
  - name: appliedAt
    type: date
    required: true
- name: Payment
  ctx: ticketing
  purpose: 外部決済の試行記録と決済状態（保留→成功/失敗）の単一の真実源
  states:
  - PENDING
  - COMPLETED
  - FAILED
  attrs:
  - name: id
    type: PaymentId
    required: true
  - name: applicationId
    type: ApplicationId
    required: true
  - name: amount
    type: Price
    required: true
  - name: status
    type: string
    required: true
    note: PENDING / COMPLETED / FAILED
  - name: externalProviderRef
    type: string
    required: false
    note: COMPLETED 遷移時に必須
  - name: attemptedAt
    type: date
    required: true
  - name: completedAt
    type: date
    required: false
- name: Refund
  ctx: ticketing
  purpose: 返金の試行記録と返金状態（保留→成功/失敗）の単一の真実源
  states:
  - PENDING
  - COMPLETED
  - FAILED
  attrs:
  - name: id
    type: RefundId
    required: true
  - name: ticketId
    type: TicketId
    required: true
  - name: paymentId
    type: PaymentId
    required: true
  - name: amount
    type: Price
    required: true
  - name: reason
    type: string
    required: true
    note: MEMBER_CANCEL / EVENT_CANCEL / EVENT_RESCHEDULE_REJECT / EVENT_REPRICE_REJECT
  - name: status
    type: string
    required: true
    note: PENDING / COMPLETED / FAILED
  - name: externalProviderRef
    type: string
    required: false
  - name: processedAt
    type: date
    required: true
- name: Ticket
  ctx: ticketing
  purpose: 確定参加権の証憑（priceSnapshot・memberAtPurchase を凍結保持）の単一の真実源
  states:
  - ISSUED
  - USED
  - REFUNDED
  attrs:
  - name: id
    type: TicketId
    required: true
  - name: applicationId
    type: ApplicationId
    required: true
  - name: eventId
    type: EventId
    required: true
  - name: memberId
    type: MemberId
    required: true
  - name: paymentId
    type: PaymentId
    required: true
  - name: participationType
    type: string
    required: true
    note: VENUE / ONLINE
  - name: priceSnapshot
    type: Price
    required: true
  - name: memberAtPurchase
    type: boolean
    required: true
  - name: status
    type: string
    required: true
    note: ISSUED / USED / REFUNDED
  - name: issuedAt
    type: date
    required: true
- name: Attendance
  ctx: attendance
  purpose: 開催当日の参加確認記録（会場チェックイン / オンライン参加）の単一の真実源
  attrs:
  - name: id
    type: AttendanceId
    required: true
  - name: ticketId
    type: TicketId
    required: true
  - name: eventId
    type: EventId
    required: true
  - name: memberId
    type: MemberId
    required: true
  - name: participationType
    type: string
    required: true
    note: VENUE / ONLINE
  - name: status
    type: string
    required: true
    note: CHECKED_IN / JOINED_ONLINE
  - name: recordedAt
    type: date
    required: true
scs:
- name: 主催者がコミュニティを作成する
  ctx: community
  actor: Organizer
  cmd: CreateCommunity
  evt: CommunityCreated
  agg: Community
  rules:
  - rule: communityName must be unique system-wide
    why: コミュニティ名はシステム全体で一意
  - rule: name and description must not be empty
    why: 名前と説明は空にできない
  - rule: ownerId must exist (the community creator)
    why: コミュニティ作成者の ownerId は必須
  errs:
  - cond: duplicateName
    err: DuplicateCommunityNameError
  - cond: emptyName
    err: InvalidCommunityDataError
- name: 参加者がコミュニティに参加する
  ctx: community
  actor: Member
  cmd: JoinCommunity
  evt: MemberJoined
  agg: Community
  rules:
  - rule: community must be in PUBLISHED status
    why: 公開済みコミュニティに対してのみ参加可能
  - rule: member must not already be a member
    why: 既存メンバーの二重参加を禁止
  - rule: members list must not contain duplicates
    why: members に重複はない
  errs:
  - cond: notPublished
    err: CommunityNotAvailableError
  - cond: duplicateMember
    err: AlreadyMemberError
- name: メンバーがコミュニティを退会する
  ctx: community
  actor: Member
  cmd: LeaveCommunity
  evt: MemberLeft
  agg: Community
  rules:
  - rule: member must be an active member and not the owner
    why: 主催者は退会できない（先に ARCHIVE）
  errs:
  - cond: notMember
    err: NotMemberError
  - cond: isOwner
    err: OwnerCannotLeaveError
  note: 既存 Ticket は memberAtPurchase で凍結保持されるため、退会の伝播は不要（POLICY なし）
- name: 主催者がイベントを作成する
  ctx: event-planning
  actor: Organizer
  cmd: CreateEvent
  evt: EventCreated
  agg: Event
  rules:
  - rule: event must belong to an existing community
    why: 既存コミュニティに紐づく
  - rule: venueCapacity and onlineCapacity must be non-negative
    why: 定員は非負、両方0は禁止
  - rule: at least one of venueCapacity or onlineCapacity must be positive
  - rule: startDateTime must be in the future
    why: 開催日時は未来
  - rule: endDateTime must be after startDateTime
    why: 終了日時は開始日時より後
  - rule: when venueCapacity > 0, venueName and venueAddress are required
    why: 会場枠を持つときは会場情報が必須
  - rule: memberPrice must be less than or equal to generalPrice
    why: メンバー料金 ≤ 一般料金
  errs:
  - cond: communityNotFound
    err: CommunityNotFoundError
  - cond: invalidCapacity
    err: InvalidCapacityError
  - cond: pastDateTime
    err: InvalidScheduleError
- name: 主催者がイベントを公開する
  ctx: event-planning
  actor: Organizer
  cmd: PublishEvent
  evt: EventPublished
  agg: Event
  rules:
  - rule: event must be in DRAFT status
    why: DRAFT 状態のみ公開可能
  - rule: all required fields must be filled
    why: 必須項目が揃っていること（onlineCapacity > 0 なら streamUrl 必須など）
  - rule: when onlineCapacity > 0, streamUrl must be set by publish time
    why: オンライン枠を持つときは PUBLISHED 時までに streamUrl が必須
  errs:
  - cond: alreadyPublished
    err: InvalidStatusTransitionError
  - cond: incompleteData
    err: InvalidEventDataError
- name: 主催者が定員を増やす
  ctx: event-planning
  actor: Organizer
  cmd: IncreaseCapacity
  evt: CapacityIncreased
  agg: Event
  rules:
  - rule: event must be PUBLISHED and not CANCELLED
    why: PUBLISHED 状態かつ未中止
  - rule: new capacity must be greater than current capacity
    why: 新定員は現定員より大きい（減少不可）
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  - cond: notIncrease
    err: InvalidCapacityError
  pol:
  - PromoteWaitlistOnCapacityIncrease
- name: 主催者が日時を変更する
  ctx: event-planning
  actor: Organizer
  cmd: RescheduleEvent
  evt: EventRescheduled
  agg: Event
  rules:
  - rule: event must be PUBLISHED and not started
    why: 開催前のみ変更可
  - rule: new dateTime must be in the future
    why: 新日時は未来
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  - cond: pastDateTime
    err: InvalidScheduleError
  pol:
  - ReconfirmOnEventReschedule
- name: 主催者が会場を変更する
  ctx: event-planning
  actor: Organizer
  cmd: RelocateEvent
  evt: EventRelocated
  agg: Event
  rules:
  - rule: event must be PUBLISHED and not started
    why: 開催前のみ変更可
  - rule: must not change participation type composition
    why: participationType 構成（会場枠/オンライン枠）の変更は不可
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  - cond: typeChange
    err: ParticipationTypeChangeNotAllowedError
  pol:
  - NotifyOnEventRelocation
- name: 主催者が料金を変更する
  ctx: event-planning
  actor: Organizer
  cmd: RepriceEvent
  evt: EventRepriced
  agg: Event
  rules:
  - rule: event must be PUBLISHED and not started
    why: 開催前のみ変更可
  - rule: price change applies only to future applications
    why: 既存申込の Ticket は priceSnapshot で凍結、変更は新規申込にのみ適用
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  pol:
  - ReconfirmOnEventReprice
- name: 主催者がイベント中止を要求する
  ctx: event-planning
  actor: Organizer
  cmd: RequestEventCancellation
  evt: EventCancellationRequested
  agg: Event
  rules:
  - rule: event must not have already occurred
    why: 開催済み・既中止は不可
  - rule: event must not be already CANCELLED
  errs:
  - cond: eventAlreadyOccurred
    err: EventAlreadyOccurredError
  - cond: alreadyCancelled
    err: EventAlreadyCancelledError
  pol:
  - RefundAllOnEventCancellation
- name: システムが全返金完了でイベント中止を確定する
  ctx: event-planning
  actor: System
  cmd: CompleteEventCancellation
  evt: EventCancellationCompleted
  agg: Event
  rules:
  - rule: all confirmed applications must have been refunded
    why: 全 confirmed 申込の返金が完了している
  errs:
  - cond: pendingRefunds
    err: RefundsPendingError
- name: 主催者がイベントを開催完了にする
  ctx: event-planning
  actor: Organizer
  cmd: CompleteEvent
  evt: EventCompleted
  agg: Event
  rules:
  - rule: event start dateTime must have passed
    why: 開催日時通過後のみ完了可
  - rule: event must be PUBLISHED (not CANCELLED)
    why: PUBLISHED 状態のみ完了可
  errs:
  - cond: notYetStarted
    err: EventNotStartedYetError
  - cond: invalidStatus
    err: InvalidStatusTransitionError
- name: 参加者がイベント詳細を確認して参加を申し込む
  ctx: registration
  actor: Member
  qry:
  - GetEventDetails
  - GetRemainingCapacity
  cmd: ApplyForEvent
  agg: Application
  rules:
  - rule: event must be PUBLISHED
    why: 公開済みイベントのみ
  - rule: member must not have existing active application for same event
    why: 同一イベントへの active 申込は1つまで
  - rule: participationType must match an available capacity type
    why: 選択した participationType の枠が存在する
  - rule: waitlistPosition is non-null only when status = WAITLISTED
    why: WAITLISTED 状態のときのみ waitlistPosition が非 null
  - rule: paymentDeadline is non-null only when status in {APPLIED, PROMOTED} (24h after)
    why: APPLIED / PROMOTED 状態のときのみ paymentDeadline が非 null（24時間後）
  errs:
  - cond: eventNotPublished
    err: EventNotAvailableError
  - cond: duplicateApplication
    err: AlreadyAppliedError
  - cond: noSuchCapacityType
    err: InvalidParticipationTypeError
  brs:
  - cond: remainingCapacity > 0
    evt: ApplicationSubmitted
    pol: ProcessPaymentForApplication
  - cond: remainingCapacity = 0
    evt: ApplicationWaitlisted
  note: 枠あり → APPLIED、枠なし → WAITLISTED（同一トランザクション）
- name: 参加者がキャンセルを要求する
  ctx: registration
  actor: Member
  cmd: RequestApplicationCancellation
  evt: ApplicationCancellationRequested
  agg: Application
  rules:
  - rule: application must be in CONFIRMED or PENDING_RECONFIRMATION status
    why: CONFIRMED または PENDING_RECONFIRMATION のみキャンセル要求可
  - rule: event must not have already started
    why: 開催開始後は不可
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  - cond: eventAlreadyStarted
    err: EventAlreadyStartedError
  pol:
  - RefundOnApplicationCancellation
- name: 参加者がキャンセル待ちを取下げる
  ctx: registration
  actor: Member
  cmd: WithdrawFromWaitlist
  evt: WaitlistEntryRemoved
  agg: Application
  rules:
  - rule: application must be in WAITLISTED status
    why: WAITLISTED 状態のみ取下げ可（決済前なので返金不要）
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
- name: システムが返金完了をうけてキャンセルを確定する
  ctx: registration
  actor: System
  cmd: CompleteApplicationCancellation
  evt: ApplicationCancellationCompleted
  agg: Application
  rules:
  - rule: refund must have been completed with reason = MEMBER_CANCEL
    why: 個別キャンセル経由の返金完了でのみ発火（イベント中止経由は別 POLICY が処理）
  pol:
  - PromoteWaitlistOnCancellation
- name: システムがキャンセル待ちを繰り上げる
  ctx: registration
  actor: System
  cmd: PromoteWaitlistEntry
  evt: WaitlistPromoted
  agg: Application
  rules:
  - rule: application must be in WAITLISTED status
    why: WAITLISTED 状態のみ
  - rule: paymentDeadline is set to 24 hours after promotion
    why: 繰り上げ後は PROMOTED 状態に遷移し、24h の決済期限を設定
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  pol:
  - ProcessPaymentForPromotion
- name: 参加者が変更通知を受けて継続参加を選択する
  ctx: registration
  actor: Member
  cmd: ConfirmContinuation
  evt: ContinuationConfirmed
  agg: Application
  rules:
  - rule: application must be in PENDING_RECONFIRMATION status
    why: 再同意待ち状態のみ
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
- name: システムが再同意を要求する
  ctx: registration
  actor: System
  cmd: RequestReconfirmation
  evt: ReconfirmationRequested
  agg: Application
  rules:
  - rule: application must be in CONFIRMED status
    why: 対象は CONFIRMED 状態の Application
  - rule: status transitions from CONFIRMED to PENDING_RECONFIRMATION
    why: CONFIRMED → PENDING_RECONFIRMATION へ状態遷移
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
- name: システムがイベント中止に伴い申込をキャンセルする
  ctx: registration
  actor: System
  cmd: CancelApplicationDueToEventCancel
  evt: ApplicationCancelledDueToEventCancel
  agg: Application
  rules:
  - rule: application must be in CONFIRMED status
    why: 対象は CONFIRMED 状態の Application
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  note: status を CANCELLED に遷移（繰り上げ POLICY は発火しない別 EVT）
- name: システムが決済を実行する
  ctx: ticketing
  actor: System
  cmd: ExecutePayment
  agg: Payment
  rules:
  - rule: payment amount must match expected price
    why: 金額は Ticket の priceSnapshot（または Event 料金）と一致
  - rule: must not have existing COMPLETED Payment for same Application
    why: Application が参照する Payment は最大1つの COMPLETED まで
  - rule: externalProviderRef is required when transitioning to COMPLETED
    why: COMPLETED への遷移時 externalProviderRef が必須
  errs:
  - cond: amountMismatch
    err: PaymentAmountMismatchError
  - cond: alreadyCompleted
    err: PaymentAlreadyCompletedError
  brs:
  - cond: cardValid
    evt: PaymentCompleted
    pol: IssueTicketOnPaymentSuccess
  - cond: cardInvalid
    evt: PaymentFailed
    pol: ExpireApplicationOnPaymentFailure
  note: カード成功 → PaymentCompleted、カード失敗 → PaymentFailed（同一TX）
- name: システムがチケットを発行する
  ctx: ticketing
  actor: System
  cmd: IssueTicket
  evt: TicketIssued
  agg: Ticket
  rules:
  - rule: payment must have been completed
    why: 対応する Payment が COMPLETED
  - rule: ticket must capture priceSnapshot and memberAtPurchase
    why: 発行時の priceSnapshot と memberAtPurchase を凍結保持
  - rule: at most one Ticket exists per Application
    why: 1 つの Application に対応する Ticket は 1 つまで
  pol:
  - ConfirmApplicationOnTicketIssued
- name: システムが申込を確定する
  ctx: ticketing
  actor: System
  cmd: ConfirmApplication
  evt: ApplicationConfirmed
  agg: Application
  rules:
  - rule: application must be in APPLIED or PROMOTED status
    why: APPLIED または PROMOTED 状態のみ確定可
  - rule: matching ISSUED Ticket must exist
    why: 対応する Ticket が ISSUED 状態で存在する
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
- name: システムが返金を実行する
  ctx: ticketing
  actor: System
  cmd: ExecuteRefund
  agg: Refund
  rules:
  - rule: original Ticket must exist and not already refunded
    why: 元 Ticket が存在し、まだ返金されていない
  - rule: original Ticket must be ISSUED or USED
    why: USED の場合は会場での参加後の特例返金
  - rule: refund amount must equal Ticket.priceSnapshot
    why: 返金額は priceSnapshot と一致
  errs:
  - cond: alreadyRefunded
    err: RefundAlreadyProcessedError
  - cond: ticketNotFound
    err: TicketNotFoundError
  brs:
  - cond: reason = MEMBER_CANCEL
    evt: MemberRefundCompleted
    pol: CompleteCancellationOnMemberRefund
  - cond: reason = EVENT_CANCEL
    evt: EventRefundCompleted
    pol: CompleteEventCancellationOnAllRefunded
  note: reason 別に異なる EVT を発行し、後続 POLICY を分岐
- name: システムが期限切れの申込を取消す
  ctx: ticketing
  actor: System
  cmd: ExpireApplication
  evt: ApplicationExpired
  agg: Application
  rules:
  - rule: application must be in APPLIED or PROMOTED status
    why: APPLIED または PROMOTED 状態
  - rule: paymentDeadline must have passed
    why: 決済期限を過ぎている
  errs:
  - cond: invalidStatus
    err: InvalidStatusTransitionError
  pol:
  - PromoteWaitlistOnExpiration
- name: 参加者が会場で受付する
  ctx: attendance
  actor: Member
  cmd: CheckInAtVenue
  evt: CheckedIn
  agg: Attendance
  rules:
  - rule: Ticket must be valid and matching event
    why: Ticket が有効
  - rule: Ticket.participationType must be VENUE
    why: participationType が VENUE
  - rule: recordedAt must be within event time window
    why: 受付時刻がイベント開催時間帯
  - rule: Ticket must not already have Attendance
    why: 二重受付禁止
  - rule: Attendance.participationType must match Ticket.participationType (VENUE → CHECKED_IN)
    why: status は participationType に一致する
  errs:
  - cond: invalidTicket
    err: InvalidTicketError
  - cond: wrongType
    err: ParticipationTypeMismatchError
  - cond: wrongTime
    err: NotTodayError
  - cond: alreadyCheckedIn
    err: AlreadyCheckedInError
  - cond: ticketAlreadyUsed
    err: TicketAlreadyUsedError
- name: 参加者がオンラインで参加する
  ctx: attendance
  actor: Member
  qry:
  - GetStreamUrl
  cmd: JoinOnline
  evt: JoinedOnline
  agg: Attendance
  rules:
  - rule: Ticket must be valid and matching event
    why: Ticket が有効
  - rule: Ticket.participationType must be ONLINE
    why: participationType が ONLINE
  - rule: recordedAt must be within event time window
    why: 開催時間帯内
  - rule: Attendance.participationType must match Ticket.participationType (ONLINE → JOINED_ONLINE)
    why: status は participationType に一致する
  errs:
  - cond: invalidTicket
    err: InvalidTicketError
  - cond: wrongType
    err: ParticipationTypeMismatchError
  - cond: wrongTime
    err: NotTodayError
pols:
- name: PromoteWaitlistOnCapacityIncrease
  ctx: event-planning
  trg: CapacityIncreased
  qry: GetWaitlistedApplications
  cmd: PromoteWaitlistEntry
  bulk: true
  evt: WaitlistPromoted
  note: 定員増枠でキャンセル待ちを BULK 繰り上げ
- name: ReconfirmOnEventReschedule
  ctx: event-planning
  trg: EventRescheduled
  qry: GetConfirmedApplications
  cmd: RequestReconfirmation
  bulk: true
  evt: ReconfirmationRequested
  note: 日時変更で confirmed 申込へ再同意を BULK 要求
- name: NotifyOnEventRelocation
  ctx: event-planning
  trg: EventRelocated
  qry: GetConfirmedApplications
  bulk: true
  evt: ChangeNotified
  note: '会場変更は通知のみ（再同意不要）。副作用専用 POLICY: 外部通知サービス（メール / プッシュ）を recipient ごとに呼び出す。AGG 更新は伴わないため CMD / SCENARIO は宣言せず、ChangeNotified を観測用に発行するのみ。'
- name: ReconfirmOnEventReprice
  ctx: event-planning
  trg: EventRepriced
  qry: GetConfirmedApplications
  cmd: RequestReconfirmation
  bulk: true
  evt: ReconfirmationRequested
  note: 料金変更で confirmed 申込へ再同意を BULK 要求
- name: RefundAllOnEventCancellation
  ctx: event-planning
  trg: EventCancellationRequested
  qry: GetConfirmedApplications
  cmd: ExecuteRefund
  bulk: true
  note: イベント中止で全 confirmed 申込を BULK 返金（reason = EVENT_CANCEL）
- name: CompleteEventCancellationOnAllRefunded
  ctx: event-planning
  trg: EventRefundCompleted
  qry: GetPendingRefundsForEvent
  cmd: CompleteEventCancellation
  note: 全 confirmed 申込の返金完了でイベント中止を確定。Saga インスタンスは eventId 単位で EventRefundCompleted を累積し、QRY で残返金件数を確認 → ゼロ件で CompleteEventCancellation を発行（D-saga-instance 参照）
- name: RefundOnApplicationCancellation
  ctx: registration
  trg: ApplicationCancellationRequested
  cmd: ExecuteRefund
  note: キャンセル要求を受けて返金処理を起動（CMD ExecuteRefund は reason = MEMBER_CANCEL で発行）
- name: PromoteWaitlistOnCancellation
  ctx: registration
  trg: ApplicationCancellationCompleted
  qry: GetNextWaitlistedApplication
  cmd: PromoteWaitlistEntry
  note: 個別キャンセル経由のキャンセル確定で空席発生 → 1 名繰り上げ
- name: PromoteWaitlistOnExpiration
  ctx: registration
  trg: ApplicationExpired
  qry: GetNextWaitlistedApplication
  cmd: PromoteWaitlistEntry
  note: 決済期限切れによる失効でも空席発生 → 1 名繰り上げ
- name: CancelApplicationsOnEventCancellation
  ctx: registration
  trg: EventCancellationCompleted
  qry: GetConfirmedApplications
  cmd: CancelApplicationDueToEventCancel
  bulk: true
  note: イベント中止確定で関連 confirmed 申込を一括 CANCELLED に（BULK・繰り上げ抑止）
- name: ProcessPaymentForApplication
  ctx: ticketing
  trg: ApplicationSubmitted
  cmd: ExecutePayment
  note: 申込発生で決済 Saga を開始
- name: ProcessPaymentForPromotion
  ctx: ticketing
  trg: WaitlistPromoted
  cmd: ExecutePayment
  note: 繰り上げ通知で決済 Saga を開始（24h 期限付き）
- name: IssueTicketOnPaymentSuccess
  ctx: ticketing
  trg: PaymentCompleted
  cmd: IssueTicket
  note: 決済成功でチケット発行
- name: ExpireApplicationOnPaymentFailure
  ctx: ticketing
  trg: PaymentFailed
  cmd: ExpireApplication
  note: 決済失敗で申込を即時失効
- name: ConfirmApplicationOnTicketIssued
  ctx: ticketing
  trg: TicketIssued
  cmd: ConfirmApplication
  note: チケット発行で申込を確定状態に
- name: CompleteCancellationOnMemberRefund
  ctx: ticketing
  trg: MemberRefundCompleted
  cmd: CompleteApplicationCancellation
  note: 個別キャンセル経由の返金完了でキャンセル状態を確定
- name: ExpireApplicationOnPaymentDeadline
  ctx: ticketing
  trg: PaymentDeadlinePassed
  cmd: ExpireApplication
  note: スケジューラが決済期限経過を検知して申込を失効させる。発行元（cron / Temporal / 単体スケジューラ）の選定は D-scheduler 参照
flows:
- id: happy
  title: ハッピーパス — コミュニティ作成から参加確定・開催完了まで
  kind: happy
  steps:
  - 主催者がコミュニティを作成する
  - 参加者がコミュニティに参加する
  - 主催者がイベントを作成する
  - 主催者がイベントを公開する
  - 参加者がイベント詳細を確認して参加を申し込む
  - ProcessPaymentForApplication
  - システムが決済を実行する
  - IssueTicketOnPaymentSuccess
  - システムがチケットを発行する
  - ConfirmApplicationOnTicketIssued
  - システムが申込を確定する
  - 参加者が会場で受付する
  - 主催者がイベントを開催完了にする
- id: alt-cancel
  title: 代替シナリオ — 参加キャンセル Saga（要求 → 返金 → 完了 → 繰り上げ）
  kind: alt
  steps:
  - 参加者がキャンセルを要求する
  - RefundOnApplicationCancellation
  - システムが返金を実行する
  - CompleteCancellationOnMemberRefund
  - システムが返金完了をうけてキャンセルを確定する
  - PromoteWaitlistOnCancellation
  - システムがキャンセル待ちを繰り上げる
- id: alt-event-cancel
  title: 代替シナリオ — イベント中止 Saga（要求 → BULK 並列返金 → Join で完了）
  kind: alt
  steps:
  - 主催者がイベント中止を要求する
  - RefundAllOnEventCancellation
  - システムが返金を実行する
  - CompleteEventCancellationOnAllRefunded
  - システムが全返金完了でイベント中止を確定する
- id: alt-payment-deadline
  title: 代替シナリオ — 決済期限切れ → 自動取消 → 繰り上げ
  kind: alt
  steps:
  - ExpireApplicationOnPaymentDeadline
  - システムが期限切れの申込を取消す
  - PromoteWaitlistOnExpiration
  - システムがキャンセル待ちを繰り上げる
- id: alt-capacity-increase
  title: 代替シナリオ — 定員増枠 → BULK 繰り上げ
  kind: alt
  steps:
  - 主催者が定員を増やす
  - PromoteWaitlistOnCapacityIncrease
  - システムがキャンセル待ちを繰り上げる
- id: alt-reschedule
  title: 代替シナリオ — 日時変更 → BULK 再同意要求 → 継続参加選択
  kind: alt
  steps:
  - 主催者が日時を変更する
  - ReconfirmOnEventReschedule
  - システムが再同意を要求する
  - 参加者が変更通知を受けて継続参加を選択する
- id: alt-relocate
  title: 代替シナリオ — 会場変更 → BULK 通知（副作用のみ・AGG 更新なし）
  kind: alt
  steps:
  - 主催者が会場を変更する
  - NotifyOnEventRelocation
- id: alt-reprice
  title: 代替シナリオ — 料金変更 → BULK 再同意要求
  kind: alt
  steps:
  - 主催者が料金を変更する
  - ReconfirmOnEventReprice
  - システムが再同意を要求する
- id: alt-leave-community
  title: 代替シナリオ — コミュニティ退会（既存チケットには伝播しない）
  kind: alt
  steps:
  - メンバーがコミュニティを退会する
decisions:
- id: D-application-status
  topic: 申込状態の表現（受付と決済確定を一段で表すか二段で表すか）
  chosen: two-stage-application-confirmed
  options:
  - name: two-stage-application-confirmed
    adopted: true
    why: 'Application は申込受付 (APPLIED) → 決済完了で CONFIRMED とし、ApplicationSubmitted を暫定 EVT、ApplicationConfirmed を業務確定 EVT として明示する'
  - name: single-stage-applied-only
    why_not: 決済保留中と確定済みを区別できず、繰り上げや返金 Saga の判定が複雑化する
  affects:
  - Application
  - ApplicationSubmitted
  - ApplicationConfirmed
- id: D-cancel-saga
  topic: 個別キャンセルの Saga 構造（一段確定か二段確定か）
  chosen: two-stage-cancel-saga
  options:
  - name: two-stage-cancel-saga
    adopted: true
    why: ApplicationCancellationRequested → 返金完了後 ApplicationCancellationCompleted の二段化で、返金 Saga の進行と AGG 状態を整合させる
  - name: immediate-cancel
    why_not: 返金未完了でキャンセル確定すると、繰り上げ POLICY が発火して空席が誤って提供される
  affects:
  - Application
  - Refund
- id: D-event-cancel-saga
  topic: イベント中止の Saga 構造（一段確定か二段確定か）
  chosen: two-stage-event-cancel-saga
  options:
  - name: two-stage-event-cancel-saga
    adopted: true
    why: EventCancellationRequested → 全返金完了後 EventCancellationCompleted の二段化で BULK 並列返金の Join を表現
  - name: immediate-event-cancel
    why_not: 返金未完了で中止確定すると返金未消化のまま閉じる Saga が残る
  affects:
  - Event
  - Refund
- id: D-event-change-cmds
  topic: イベント変更操作の CMD 分解（汎用 UpdateEventInfo か属性別か）
  chosen: per-attribute-cmds
  options:
  - name: per-attribute-cmds
    adopted: true
    why: RescheduleEvent / RelocateEvent / RepriceEvent に分解することで、属性ごとに異なる再同意ポリシー（再同意必須 vs 通知のみ）を CMD レベルで明示できる
  - name: generic-update-event-info
    why_not: 単一 CMD では属性ごとの POLICY 分岐を CMD 外で持つ必要があり、責務がぼやける
  affects:
  - Event
  - RescheduleEvent
  - RelocateEvent
  - RepriceEvent
- id: D-member-price-snapshot
  topic: メンバー料金スナップショットの保持方法
  chosen: ticket-snapshot
  options:
  - name: ticket-snapshot
    adopted: true
    why: Ticket に memberAtPurchase（boolean）と priceSnapshot を保持し、コミュニティ退会後も価格不変とする
  - name: recompute-on-event
    why_not: 退会のたびに Application 価格を再計算する必要があり、Community → Ticketing の伝播 POLICY が増える
  affects:
  - Ticket
  - Community
- id: D-reconfirm-model
  topic: イベント変更時の再同意モデル（属性別の扱い）
  chosen: per-attribute-reconfirm
  options:
  - name: per-attribute-reconfirm
    adopted: true
    why: 日時 (Reschedule) と料金 (Reprice) は再同意必須、会場 (Relocate) は通知のみ
  - name: always-reconfirm
    why_not: 軽微な会場変更でも全員に再同意を強いると参加率が下がる
  - name: never-reconfirm
    why_not: 日時・料金の重大変更でも参加者の同意を得られず、Saga 完了の業務妥当性が失われる
  affects:
  - Application
  - ReconfirmOnEventReschedule
  - ReconfirmOnEventReprice
  - NotifyOnEventRelocation
- id: D-promotion-deadline
  topic: キャンセル待ち繰り上げの決済期限
  chosen: 24h-no-cap
  options:
  - name: 24h-no-cap
    adopted: true
    why: 繰り上げ通知後 24 時間を決済期限、繰り上げ回数の上限はなし
  - name: shorter-deadline
    why_not: 平日昼の通知では支払いが間に合わず機会損失が大きい
  affects:
  - Application
  - ProcessPaymentForPromotion
- id: D-capacity-split
  topic: オンライン枠と会場枠の集約境界
  chosen: same-event-aggregate
  options:
  - name: same-event-aggregate
    adopted: true
    why: 同一 Event AGG 内に venueCapacity / onlineCapacity を独立管理し、企画変更の一貫性を 1 つの AGG に閉じ込める
  - name: separate-aggregates-per-type
    why_not: 同一イベントの定員変更や中止操作が複数 AGG に跨り、トランザクション境界の調整が増える
  affects:
  - Event
- id: D-event-complete
  topic: 開催完了の確定方式（自動か手動か）
  chosen: manual-complete-by-organizer
  options:
  - name: manual-complete-by-organizer
    adopted: true
    why: 主催者の明示確定（CompleteEvent CMD）。開催時間経過だけでは現実の終了と一致しない場合がある
  - name: auto-on-endDateTime
    why_not: 延長や早期解散などの実運用と乖離する
  affects:
  - Event
  - CompleteEvent
- id: D-leave-community-propagation
  topic: コミュニティ退会と既存チケットの関係
  chosen: independent-aggregates
  options:
  - name: independent-aggregates
    adopted: true
    why: Community と Ticket は独立した状態（Ticket が memberAtPurchase を凍結保持）。退会から Ticket への伝播 POLICY は不要
  - name: invalidate-on-leave
    why_not: 退会で既存チケットの参加権が消えると、申込時点の参加権の保証が崩れる
  affects:
  - Community
  - Ticket
- id: D-saga-instance
  topic: イベント中止 Saga の Join 実装方針
  chosen: query-based-join
  options:
  - name: query-based-join
    adopted: true
    why: eventId 単位で EventRefundCompleted を累積し、QRY GetPendingRefundsForEvent で残返金件数を確認 → ゼロ件で CompleteEventCancellation を発行する
  - name: in-memory-saga-state
    why_not: 永続化と再起動耐性の追加実装が必要になる
  affects:
  - CompleteEventCancellationOnAllRefunded
  - GetPendingRefundsForEvent
  note: 実装フェーズで Saga インスタンス管理の詳細を確定する
- id: D-scheduler
  topic: 決済期限経過の検出基盤
  chosen: deferred-to-implementation
  options:
  - name: deferred-to-implementation
    adopted: true
    why: PaymentDeadlinePassed の発行元（cron / Temporal / 単体スケジューラ）はドメインモデルでは決定せず実装フェーズで選定する
  affects:
  - ExpireApplicationOnPaymentDeadline
  - PaymentDeadlinePassed
  note: 実装フェーズで選定
