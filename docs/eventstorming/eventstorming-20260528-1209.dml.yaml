    status: open
  - id: Q7
    topic: "概算査定額算出後の業務（離脱追跡・誘導通知）"
    why: "会員が概算を見ただけで離脱したケースの追跡や、概算→注文への誘導通知が必要かどうかを決める"
    status: open
  - id: Q8
    topic: "偽物・盗品疑い検出後の業務手順（Alt-4 / alt-suspicious）"
    why: "`SuspiciousItemDetected` 後、業務監督者への報告・古物営業法 15 条に基づく確認手続き・所轄警察への申告・会員への保留通知のうちどれを誰がどの順番で行うか、また TradeIn が SUSPENDED から解除される条件を決める"
