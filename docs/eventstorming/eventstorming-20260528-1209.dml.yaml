        NewItemDelivered: "新品が配送完了した"
      pols:
        InstructShipmentOnSettled: "成立時に出荷指示"
      states:
        INSTRUCTED: "出荷指示済み"
        SHIPPED: "発送済み"
        DELIVERED: "配送完了"
        CANCELLED: "キャンセル"
    up:
