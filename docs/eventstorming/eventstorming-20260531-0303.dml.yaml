narratives:
  - id: happy
    title: ハッピーパス — 起案から稟議成立まで
    kind: happy
    entry: 起案者が稟議を起案する
    prose: |
      営業部の田中は、新しい業務ツールの導入を進めたいと考えていた。費用は社内規程で
      役員承認まで必要な金額帯にあたる。田中はまず稟議の下書きを作成し、件名・目的・
      金額・添付見積を埋めていく。書き上がったところで内容を確認し、稟議を提出した。

      提出を受けて、システムは田中の所属と申請金額・種別から承認ルートを自動的に組んだ。
      今回は「課長 → 部長 → 担当役員」の3段。まず課長のもとに承認依頼が届く。課長は
      内容を確認して承認し、稟議は次の部長へと進んだ。部長も妥当と判断して承認、最後に
      担当役員が承認する。

      全段の承認がそろった時点で、この稟議は正式に成立した。田中のもとに成立の通知が届き、
      彼は安心してツール導入の手続きへと動き出した。稟議は記録として残り、誰がいつ承認した
      かの履歴も追える状態になっている。

  - id: alt-reject
    title: 代替シナリオ — 途中で差し戻される
    kind: alt
    entry: 承認者が稟議を差し戻す
    prose: |
      部長が内容を確認したところ、見積の根拠が不足していた。部長は理由を添えて稟議を
      差し戻す。稟議は下書き状態に戻り、起案者の田中のもとへ。これまでの課長承認は
      いったん無効になる。田中は指摘を反映して見積を添え直し、改めて提出する。ルートは
      再び課長から組み直され、順次承認が回り始める。

  - id: alt-discard
    title: 代替シナリオ — 起案者が破棄する
    kind: alt
    entry: 起案者が稟議を破棄する
    prose: |
      別件で、田中は作りかけの下書きが不要になったことに気づいた。導入予定だった
      ツールが全社標準として別途決まったためだ。田中はこの稟議を破棄する。破棄された
      稟議はライフサイクルを終え、以後の提出も承認もできない。記録としては「破棄済み」
      の状態で残る。
