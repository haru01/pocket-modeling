    why: 配送会社の配達完了データとシステム未連携で、現状 CS が追跡ページを手動確認。モデル上の終端をどこに置くかの判断が必要
    status: closed
    decision_id: D3
narratives:
  - id: happy
    kind: happy
    title: ハッピーパス — 注文確定から配達まで
    prose: "お客様がガジェットマートのサイトで商品を注文確定すると、決済代行（PSP)が即時にクレジットカードの与信を確保する。与信が取れると注文は「受注確定」となり、お客様へ注文確認メールが送られる。受注確定した注文は、1日3回（9時・13時・17時）の定時バッチで 3PL 倉庫へ出荷指示データとして送られる。3PL はピッキング・梱包を行い、当日または翌日にヤマトまたは佐川へ荷物を引き渡す。引き渡し時に送り状番号が受注管理システムへ戻り、注文は「出荷済み」となってお客様へ発送メールが送られる。同時に受注管理は決済代行へ売上確定を送り、与信済みだった代金が実際に請求される（出荷前に売上確定しないのが社内ルール）。商品は発送から1〜3日でお客様に届き、月あたり約2万件の注文の大半がこの流れで完結する。\n"
    entry: 客が商品を注文確定する
  - id: alt-cancel-before-batch
    kind: alt
    title: 代替 — 出荷指示バッチ前のキャンセル
    prose: "お客様のキャンセル依頼を CS がメール・電話で受け付ける（CS 内の呼称は「取消」）。注文がまだ出荷指示バッチに乗っていなければ、受注管理で注文を取消にするだけで次バッチの対象から外れ、決済代行へ与信取消を送って完結する。\n"
    entry: CSがキャンセル依頼を受け付ける
  - id: alt-cancel-race
    kind: alt
    title: 代替 — バッチ後のキャンセル競合（出荷停止依頼）
    prose: "出荷指示バッチが既に 3PL へ渡った後のキャンセル依頼は、システムでは止められない。CS が 3PL 窓口へ電話で出荷停止を依頼し、結果待ちの間の「取消依頼中」状態はシステムに存在せず担当者の Excel 管理となる。ピッキング前なら停止でき取消として完結、梱包済みなら出荷されてしまい、お届け後の返品扱いに切り替えてお客様へ案内する。\n"
    entry: CSがキャンセル依頼を受け付ける
  - id: alt-return-refund
    kind: alt
    title: 代替 — お届け後の返品と返金のタイムラグ
    prose: "お届け後の返品は CS が理由（初期不良／お客様都合）を確認して返品受付番号を発行し、お客様が 3PL 倉庫へ返送する。検品が通ると「返品入庫」の連絡が入り、CS は注文を返品確定にして「返金処理いたします」とお客様へメールする。だが実際の返金は経理が週2回（火・金）まとめて決済代行の管理画面から操作し、カード会社の明細反映にさらに1〜2週間かかるため、CS の完了連絡から返金確認まで最長3週間近く空き、再入電の原因になっている。コンビニ払い・銀行振込の注文は口座確認が挟まりさらに時間がかかる。\n"
    entry: CSが返品を受け付け受付番号を発行する
  - id: alt-prepaid
    kind: alt
    title: 代替 — 前払い注文の入金待ちと期限切れ自動取消
    entry: 客が商品を注文確定する
    prose: コンビニ払い・銀行振込の注文（全体の約15%）は、入金が確認できるまで受注確定しない。入金待ちのまま1週間経過すると自動的に取消される。入金があれば通常フローに合流する。
