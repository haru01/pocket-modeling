    sub: messaging
decisions:
  - id: D1
    topic: 参加費を扱うかどうか
    chosen: free-only
    options:
      - name: free-only
        label: 無料のみ
        adopted: true
        why: 今回の関心は主催者側の開催運営（開催するかどうかの判断と定員のさばき方）にある。参加費を入れると「申し込んだ」と「払った」が別々の状態になり、未払いの扱いや返金という別の業務が中心に居座ってしまうため、無料に固定して開催可否と定員の判断に集中させた。
      - name: paid-supported
        label: 有料も扱う
        why_not: 当日受付でも支払済みかどうかを見る必要が出て、受付の話が会計の話に変わる。今回のスコープ（企画〜当日）では主催者の痛みの中心ではない。
    affects:
      - Registration
      - AttendanceSheet
      - registration
      - check-in
    note: 有料化する場合は payment を別 BC として足し、Registration に「支払済み」の状態を持ち込まず参照で解決する方針で再検討する。
  - id: D2
    topic: 節目イベントをどこに置くか
    chosen: publish-confirm-hold
    options:
      - name: publish-confirm-hold
        label: 募集公開／開催確定／開催完了の3つ
        adopted: true
        why: この3つの前後で「主催者が何を自由に変えられるか」が変わる。公開前は何でも直せる、公開後は参加者との約束が生まれる、開催確定後は日程と会場を動かせない。関係者の可逆性が変わる点が業務上の節目である。
      - name: draft-and-held
        label: 企画と開催完了の2つ
        why_not: 一番緊張する「開催するかどうかを決める瞬間」が節目として現れず、タイムラインが平坦になる。
    affects:
      - Meetup
      - BookVenueOnMeetupConfirmed
      - PrepareSheetOnMeetupConfirmed
      - NotifyAttendeesOnMeetupConfirmed
      - meetup-hosting
      - venue-booking
      - check-in
      - notification
  - id: D3
    topic: 開催管理と参加申込を分けるかどうか
    chosen: split-hosting-and-registration
    options:
      - name: split-hosting-and-registration
        label: 開催管理と参加申込を別の文脈に分ける
        adopted: true
        why: 主催者が「開催するか」を決めるリズムと、参加者の申込が入れ替わるリズムがまるで違う。ひとつにすると、キャンセル待ちの繰り上げのたびにミートアップ本体を触ることになり、開催確定という一度きりの判断が席の出入りに巻き込まれる。
      - name: single-meetup-aggregate
        label: ミートアップ一つに申込も抱えさせる
        why_not: 申込が数百件になると、一人の取消のたびにミートアップ全体を書き換える形になり、同時に申し込む人どうしがぶつかる。定員チェックは楽になるが、その代償が大きい。
    affects:
      - Meetup
      - Registration
      - meetup-hosting
      - registration
    note: 定員超過を防ぐ責任は registration 側に残る。Meetup は定員という数字だけを供給し、席の配分には関与しない。
  - id: D4
    topic: キャンセル待ちの繰り上げを自動でやるか主催者の操作にするか
    chosen: auto-promote
    options:
      - name: auto-promote
        label: 取消が出たら自動で先頭を繰り上げる
        adopted: true
        why: 空席が出た瞬間から埋まるまでの時間がそのまま参加機会の損失になる。主催者は日中働いていて即応できないので、待っている人にとっては自動のほうが公平で速い。
      - name: manual-promote
        label: 主催者が選んで繰り上げる
        why_not: 主催者に「誰を入れるか」の裁量が生まれ、先着順という約束が崩れる。運営の手間も増える。
    affects:
      - Registration
      - PromoteWaitlistOnCancellation
      - AddPromotedAttendeeToSheet
      - registration
      - check-in
    note: 受付開始後は繰り上げない。当日その場にいない人を確定にしても席は埋まらないため。
  - id: D5
    topic: 中止に伴う申込の無効化を通常の取消と同じ扱いにするか
    chosen: separate-revoked-state
    options:
      - name: separate-revoked-state
        label: 中止由来は別の状態（無効）と別のイベントにする
        adopted: true
        why: 中止で全件を取り消すと、その取消一件ごとに繰り上げが走り、消えていく席へ次々と人を繰り上げるという無意味な動きが起きる。参加者から見ても「自分で降りた」のか「中止された」のかは別の出来事で、通知の文面も変わる。
      - name: reuse-cancelled
        label: 通常の取消と同じイベントで表す
        why_not: モデルは小さくなるが、繰り上げポリシーに「ミートアップが中止でないとき」という外部の状態を見る条件が必要になり、参加申込の判断が開催管理の状態に依存してしまう。
    affects:
      - Registration
      - PromoteWaitlistOnCancellation
      - RevokeRegistrationsOnMeetupCancelled
      - NotifyAttendeesOnMeetupCancelled
      - registration
      - notification
  - id: D6
    topic: 当日の出欠を申込に持たせるか別の集約にするか
    chosen: attendance-sheet
    options:
      - name: attendance-sheet
        label: 出欠簿を当日受付の集約として独立させる
        adopted: true
        why: 当日の受付は「その日の名簿」という一枚の紙として扱うのが主催者の実感に近い。受付の締切という一度きりの操作で名簿全体を確定でき、締切後に出欠が動かないことを一箇所で守れる。
      - name: attendance-on-registration
        label: 申込に出席フラグを持たせる
        why_not: 受付の締切という「全員まとめて確定する」操作の置き場所がなくなり、未受付を欠席にする処理が申込一件ずつの都合に散らばる。
    affects:
      - AttendanceSheet
      - Registration
      - PrepareSheetOnMeetupConfirmed
      - AddPromotedAttendeeToSheet
      - DropAttendeeFromSheetOnCancellation
      - check-in
      - registration
    note: 出欠簿は参加確定者の一覧から作られるコピーであり、締切後は申込側の変化を追わない。
  - id: D7
    topic: 定員を超えないことを、どの集約が守るか
    chosen: registration-guards-with-supplied-capacity
    options:
      - name: registration-guards-with-supplied-capacity
        label: 定員という数字は Meetup が持ち、超えない責任は参加申込側が負う
        adopted: true
        why: 席の出入りは申込側でしか起きないので、超過が起きうる瞬間も申込側にしかない。定員の数字だけを受け取って守る形にすれば、ミートアップ本体は申込の増減に巻き込まれずに済む。
      - name: meetup-guards-seats
        label: ミートアップ本体が席の一覧を抱えて守る
        why_not: 一人が申し込むたびにミートアップ全体を書き換えることになり、同時に申し込む参加者どうしがぶつかる。D3 で分けた意味が失われる。
    affects:
      - Meetup
      - Registration
      - meetup-hosting
      - registration
    note: 参加申込は一人ぶんの粒度なので、この不変条件は申込一件では守れない。ミートアップ単位で申込をまとめて見る仕組みが実装側に要る点は未解決として残す（Q4）。
  - id: D8
    topic: 参加者がいつまで取り消せるかを、何を見て判断するか
    chosen: cancellation-deadline-on-meetup
    options:
      - name: cancellation-deadline-on-meetup
        label: ミートアップが持つ取消締切の時刻で判断する
        adopted: true
        why: 参加者に「何時まで降りられるか」を先に伝えられる。繰り上げが間に合う余裕を主催者が回ごとに決められるのも実務に合う。
      - name: check-in-opened-flag
        label: 当日の受付が始まったかどうかで判断する
        why_not: 申込の可否が当日受付という別の文脈の状態に縛られる。主催者が受付を開くのを忘れていれば深夜まで取消を受け付けてしまい、逆に早く開けば予告なく取消が締まる。
    affects:
      - Meetup
      - Registration
      - PromoteWaitlistOnCancellation
      - meetup-hosting
      - registration
policies:
  - name: PromoteWaitlistOnCancellation
    ctx: registration
    trg: RegistrationCancelled
    qry: WaitlistHead
    cmd: PromoteWaitlistedRegistration
    evt: RegistrationPromoted
    agg: Registration
    within: 即時
    note: 繰り上げが働くのは取消締切までの取消に対してだけ（D8）。中止に伴う一括無効化は RegistrationRevoked という別のイベントにしてあるので、この繰り上げは連鎖しない（D5）。
  - name: BookVenueOnMeetupConfirmed
    ctx: venue-booking
    trg: MeetupConfirmed
    cmd: ConfirmVenueBooking
    agg: VenueBooking
    within: 当日中
    note: 仮押さえのまま開催確定を告知してしまうと会場を失う恐れがあるため、確定と同時に本予約へ切り替える。
  - name: ReleaseVenueOnMeetupCancelled
    ctx: venue-booking
    trg: MeetupCancelled
    cmd: ReleaseVenue
    agg: VenueBooking
    within: 当日中
    note: 会場を手放す指示は一つだが、仮押さえのままか本予約済みかで会場側への連絡の重さが変わるため、分岐は scenario 側で表す。
  - name: RevokeRegistrationsOnMeetupCancelled
    ctx: registration
    trg: MeetupCancelled
    qry: LiveRegistrationsOfMeetup
    bulk: true
    cmd: RevokeRegistration
    evt: RegistrationRevoked
    agg: Registration
    within: 即時
  - name: MarkNoShowOnCheckInClosed
    ctx: check-in
    trg: CheckInClosed
    qry: NotCheckedInAttendees
    bulk: true
    cmd: MarkNoShow
    evt: AttendeeMarkedNoShow
    agg: AttendanceSheet
    within: 即時
  - name: NotifyAttendeesOnMeetupConfirmed
    ctx: notification
    trg: VenueBookingConfirmed
    qry: LiveRegistrationsOfMeetup
    bulk: true
    cmd: SendMeetupNotice
    evt: MeetupConfirmationNoticeSent
    within: 即時
    note: 開催確定そのものではなく、会場の本予約が済んだことを引き金にする。本予約に失敗した状態で「開催します」と伝えると、会場のない確定を参加者に約束することになるため。
  - name: NotifyAttendeesOnMeetupCancelled
    ctx: notification
    trg: RegistrationRevoked
    cmd: SendMeetupNotice
    evt: MeetupCancellationNoticeSent
    within: 即時
    note: 中止イベントを一括で読み直すと、先に申込が無効化されて通知先が空になる恐れがある。無効化された申込一件ずつを引き金にすれば、宛先の取りこぼしが起きない。
  - name: PrepareSheetOnMeetupConfirmed
    ctx: check-in
    trg: MeetupConfirmed
    qry: LiveRegistrationsOfMeetup
    cmd: PrepareAttendanceSheet
    evt: AttendanceSheetPrepared
    agg: AttendanceSheet
    within: 当日中
    note: 開催確定の時点の参加確定者一覧から当日の名簿を起こす。以降の申込の増減は繰り上げ経由で名簿に反映する。
  - name: AlertOrganizerOnVenueLost
    ctx: notification
    trgs:
      evts:
        - VenueHoldExpired
        - VenueBookingRejected
      mode: any
    cmd: SendOrganizerAlert
    evt: OrganizerAlertSent
    within: 即時
    note: 会場を失ったことに主催者が気づかないまま募集や開催確定が進むのを防ぐ。
  - name: AddPromotedAttendeeToSheet
    ctx: check-in
    trg: RegistrationPromoted
    cmd: EnrollAttendeeOnSheet
    evt: AttendeeAddedToSheet
    agg: AttendanceSheet
    within: 即時
    note: 繰り上がった人が名簿に載らないと、当日その人だけ受付で弾かれる。
  - name: DropAttendeeFromSheetOnCancellation
    ctx: check-in
    trg: RegistrationCancelled
    cmd: DropAttendeeFromSheet
    evt: AttendeeDroppedFromSheet
    agg: AttendanceSheet
    within: 即時
    note: 取り消した人を名簿に残すと、締切時に全員が欠席として記録され、当日の実態と食い違う。
  - name: SuspendPublicationOnVenueHoldExpired
    ctx: meetup-hosting
    trg: VenueHoldExpired
    cmd: SuspendMeetupPublication
    evt: MeetupPublicationSuspended
    agg: Meetup
    within: 即時
    note: 会場を失ったまま募集を続けると申込が積み上がり、あとで全員を無効にすることになる。まず入口を止める。
domains:
  - name: meetup-operation
    vision: 主催者が、開催するかどうかを迷わず決められ、当日までの席のさばきと出欠の記録に手間を取られない状態をつくる。
    subs:
      - name: hosting
        type: CORE_SUBDOMAIN
        vision: 開催可否の判断そのもの。最少催行人数・会場・日程という制約を突き合わせて一度だけ決める、このアプリの心臓。
      - name: seat-allocation
        type: CORE_SUBDOMAIN
        vision: 先着順の公平さを保ったまま空席を埋める、定員のさばき方。ミートアップ運営の良し悪しがここに出る。
      - name: venue-arrangement
        type: SUPPORTING_SUBDOMAIN
        vision: 会場の仮押さえと本予約。業務には必須だが、差別化の源泉ではない。
      - name: attendance
        type: SUPPORTING_SUBDOMAIN
        vision: 当日の出欠記録。正確であればよく、工夫の余地は小さい。
      - name: messaging
        type: GENERIC_SUBDOMAIN
        vision: 通知の送信。既製の仕組みで置き換えられる。
aggregates:
  - name: Meetup
    ctx: meetup-hosting
    purpose: 一回の開催について「本当に開催するか」を一度だけ決め、決めたあとはその決定を動かさない拠り所になる。
    background: "主催者は、会場が取れるか・人が集まるか・自分の都合がつくかという、揃うタイミングの違う材料を見ながら\nどこかで腹を決めなければならない。決めたあとに日程や会場が動くと参加者の予定を壊し、次回以降の集客にも響く。\nだから「確定した」という状態そのものが、主催者にとっても参加者にとっても意味を持つ。\n"
    constraints:
      - 定員は押さえた会場の収容人数を超えてはならない
      - 最少催行人数は定員以下でなければならない
      - 募集を公開できるのは、会場が仮押さえ以上になっているミートアップだけ
      - 開催確定後は開催日時と会場を変更できない
      - 中止できるのは開催完了より前まで
    states:
      - DRAFT
      - PUBLISHED
      - SUSPENDED
      - CONFIRMED
      - CANCELLED
      - HELD
    transitions:
      - from: NONE
        to: DRAFT
        via: DraftMeetup
        when: 主催者がテーマと候補日を決めたとき
      - from: DRAFT
        to: PUBLISHED
        via: PublishMeetup
        when: 会場が仮押さえ済みで、定員と最少催行人数が決まっているとき
      - from: PUBLISHED
        to: SUSPENDED
        via: SuspendMeetupPublication
        when: 会場の仮押さえが失効したとき
      - from: SUSPENDED
        to: PUBLISHED
        via: PublishMeetup
        when: 会場を押さえ直して募集を再開するとき
      - from: PUBLISHED
        to: CONFIRMED
        via: ConfirmMeetup
        when: 確定済み申込が最少催行人数に達しているとき
      - from: PUBLISHED
        to: CANCELLED
        via: CancelMeetup
        when: 募集締切までに最少催行人数に届かなかったとき
      - from: SUSPENDED
        to: CANCELLED
        via: CancelMeetup
        when: 会場を押さえ直せなかったとき
      - from: CONFIRMED
        to: CANCELLED
        via: CancelMeetup
        when: 会場が使えなくなるなど、やむを得ない事情が生じたとき
        note: 参加者への影響が大きいため、主催者の明示的な操作でしか起きない
      - from: CONFIRMED
        to: HELD
        via: CloseMeetup
        when: 当日の受付が締め切られたあと
    attrs:
      - name: meetupId
        type: MeetupId
        required: true
      - name: title
        type: string
        required: true
      - name: description
        type: string
        required: false
        note: 参加者が参加を判断するための説明文
      - name: schedule
        type: MeetupSchedule
        required: true
        note: 開始・終了日時。確定後は変更不可
      - name: venueBookingId
        type: VenueBookingId
        required: false
        note: 仮押さえができるまでは空。公開時には必須になる
      - name: capacity
        type: Capacity
        required: false
        note: 公開時には必須。会場の収容人数以下
      - name: minimumAttendees
        type: MinimumAttendees
        required: false
        note: 公開時には必須。定員以下
      - name: applicationDeadline
        type: datetime
        required: false
        note: 開催可否を判断する期限
      - name: state
        type: MeetupState
        required: true
      - name: cancellationDeadline
        type: CancellationDeadline
        required: false
        note: この時刻を過ぎると参加者は取り消せない。繰り上げが間に合う余裕を見て開始時刻から逆算する
    events:
      - name: MeetupDrafted
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: title
            type: string
            required: true
          - name: schedule
            type: MeetupSchedule
            required: true
          - name: organizerId
            type: OrganizerId
            required: true
      - name: MeetupPublished
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: capacity
            type: Capacity
            required: true
          - name: minimumAttendees
            type: MinimumAttendees
            required: true
          - name: applicationDeadline
            type: datetime
            required: true
          - name: publishedAt
            type: datetime
            required: true
      - name: MeetupConfirmed
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: confirmedAt
            type: datetime
            required: true
          - name: confirmedAttendeeCount
            type: int
            required: true
            note: 確定時点の参加確定者数。通知と会場への連絡に使う
      - name: MeetupCancelled
        terminal: true
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: cancelledAt
            type: datetime
            required: true
          - name: reason
            type: CancellationReason
            required: true
            note: 参加者への通知にそのまま載る
      - name: MeetupHeld
        terminal: true
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: heldAt
            type: datetime
            required: true
          - name: attendeeCount
            type: int
            required: true
      - name: MinimumAttendeesNotMet
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: confirmedCount
            type: int
            required: true
          - name: minimumAttendees
            type: MinimumAttendees
            required: true
          - name: judgedAt
            type: datetime
            required: true
        note: 状態は PUBLISHED のまま変わらない。中止するかどうかは主催者が決めるため、この出来事だけでは中止にしない
      - name: MeetupPublicationSuspended
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: suspendedAt
            type: datetime
            required: true
          - name: reason
            type: string
            required: true
        note: 申込の入口を閉じるだけで、すでに受け付けた申込はそのまま生きている
  - name: Registration
    ctx: registration
    purpose: 参加者一人ぶんの席を、申し込んだ順という秩序のもとで「確定・待ち・取消」のいずれかに保つ。
    background: "ミートアップは席が有限で、しかも直前まで人が入れ替わる。主催者が手作業で名簿を書き換えると、\n誰が繰り上がったのか本人にも主催者にも分からなくなり、当日「来たのに席がない」「来ると思った人が来ない」が起きる。\n申し込んだ順を機械的に守り、空きが出たら自動で埋めることが、参加者にとっての公平さそのものになる。\n"
    constraints:
      - 同じ参加者は同じミートアップに、生きた申込を二件以上持てない
      - 確定済み申込の件数はミートアップの定員を超えてはならない
      - キャンセル待ちの順番は申し込んだ時刻の順で、後から入れ替えない
      - 取消できるのはミートアップの取消締切まで
      - 繰り上げが起きるのは取消締切までの取消に対してだけ
    states:
      - CONFIRMED
      - WAITLISTED
      - CANCELLED
      - REVOKED
    transitions:
      - from: NONE
        to: CONFIRMED
        via: ApplyForMeetup
        when: 確定済み申込が定員に達していないとき
      - from: NONE
        to: WAITLISTED
        via: ApplyForMeetup
        when: 確定済み申込が定員に達しているとき
      - from: WAITLISTED
        to: CONFIRMED
        via: PromoteWaitlistedRegistration
        when: 確定済みの誰かが取り消して空席が生まれ、まだ受付が始まっていないとき
      - from: CONFIRMED
        to: CANCELLED
        via: CancelRegistration
        when: 参加者が自分の都合で取り消したとき
      - from: WAITLISTED
        to: CANCELLED
        via: CancelRegistration
        when: 待っている参加者が自分から降りたとき
      - from: CONFIRMED
        to: REVOKED
        via: RevokeRegistration
        when: ミートアップが中止されたとき
        note: 参加者の意思による取消と区別する。繰り上げの引き金にしないため別の状態にしている
      - from: WAITLISTED
        to: REVOKED
        via: RevokeRegistration
        when: ミートアップが中止されたとき
    attrs:
      - name: registrationId
        type: RegistrationId
        required: true
      - name: meetupId
        type: MeetupId
        required: true
      - name: memberId
        type: MemberId
        required: true
      - name: appliedAt
        type: datetime
        required: true
        note: キャンセル待ちの順番はこの時刻で決まる
      - name: state
        type: RegistrationState
        required: true
      - name: waitlistPosition
        type: WaitlistPosition
        required: false
        note: WAITLISTED のときだけ意味を持つ
      - name: promotedAt
        type: datetime
        required: false
        note: 繰り上がった参加者に「いつ席が回ってきたか」を示す
    events:
      - name: RegistrationConfirmed
        params:
          - name: registrationId
            type: RegistrationId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
          - name: appliedAt
            type: datetime
            required: true
      - name: RegistrationWaitlisted
        params:
          - name: registrationId
            type: RegistrationId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
          - name: waitlistPosition
            type: WaitlistPosition
            required: true
      - name: RegistrationCancelled
        params:
          - name: registrationId
            type: RegistrationId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: previousState
            type: RegistrationState
            required: true
            note: 確定席が空いたのか、待ちが減っただけなのかを繰り上げ判断に使う
          - name: cancelledAt
            type: datetime
            required: true
      - name: RegistrationPromoted
        params:
          - name: registrationId
            type: RegistrationId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
          - name: promotedAt
            type: datetime
            required: true
      - name: RegistrationRevoked
        terminal: true
        params:
          - name: registrationId
            type: RegistrationId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
          - name: reason
            type: CancellationReason
            required: true
    note: 「確定済み件数が定員を超えない」「同じ参加者の生きた申込は一件だけ」は、いずれもミートアップ単位で申込をまとめて見ないと判定できず、申込一件の中では守れない。担保方式は未決（Q4）。定員という数字は Meetup から供給される（D7）。
  - name: VenueBooking
    ctx: venue-booking
    purpose: 一つのミートアップに対する会場の押さえを、仮押さえから本予約まで一本の線として保つ。
    background: "会場は先に押さえないと開催の見通しが立たないが、人が集まるかどうかは押さえてみないと分からない。\nこの鶏と卵を、期限つきの仮押さえという形でしのいでいるのが実務の姿である。期限を過ぎた押さえが\n生きているかのように見えてしまうと、主催者は取れていない会場を前提に募集を出してしまう。\n"
    constraints:
      - 一つのミートアップに対して生きた押さえは一件だけ
      - 仮押さえには期限があり、期限を過ぎたら失効する
      - 本予約に切り替えられるのは仮押さえが生きている間だけ
    states:
      - TENTATIVE
      - BOOKED
      - RELEASED
      - CANCELLED
      - EXPIRED
    transitions:
      - from: NONE
        to: TENTATIVE
        via: RequestVenueHold
        when: 候補日にその会場が空いているとき
      - from: TENTATIVE
        to: BOOKED
        via: ConfirmVenueBooking
        when: ミートアップの開催が確定したとき
      - from: TENTATIVE
        to: EXPIRED
        via: ExpireVenueHold
        when: 仮押さえ期限を過ぎても本予約に切り替わらなかったとき
      - from: TENTATIVE
        to: RELEASED
        via: ReleaseVenue
        when: 開催確定前にミートアップが中止されたとき
      - from: BOOKED
        to: CANCELLED
        via: ReleaseVenue
        when: 開催確定後にミートアップが中止されたとき
        note: 会場側へのキャンセル連絡を伴う。仮押さえの解放とは重さが違う
    attrs:
      - name: venueBookingId
        type: VenueBookingId
        required: true
      - name: meetupId
        type: MeetupId
        required: true
      - name: venueId
        type: VenueId
        required: true
      - name: slot
        type: MeetupSchedule
        required: true
        note: 押さえている日時の枠
      - name: venueCapacity
        type: VenueCapacity
        required: true
        note: ミートアップの定員の上限になる
      - name: holdDeadline
        type: HoldDeadline
        required: false
        note: TENTATIVE のときだけ意味を持つ
      - name: state
        type: VenueBookingState
        required: true
    events:
      - name: VenueHeld
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: venueId
            type: VenueId
            required: true
          - name: venueCapacity
            type: VenueCapacity
            required: true
          - name: holdDeadline
            type: HoldDeadline
            required: true
      - name: VenueHoldExpired
        terminal: true
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: expiredAt
            type: datetime
            required: true
      - name: VenueBookingConfirmed
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: bookedAt
            type: datetime
            required: true
      - name: VenueHoldReleased
        terminal: true
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: releasedAt
            type: datetime
            required: true
      - name: VenueHoldRejected
        terminal: true
        params:
          - name: meetupId
            type: MeetupId
            required: true
          - name: venueId
            type: VenueId
            required: true
          - name: slot
            type: MeetupSchedule
            required: true
          - name: rejectedAt
            type: datetime
            required: true
        note: 押さえが成立しなかったので VenueBooking は生まれない。日程か会場の組み直しを促すための出来事
      - name: VenueBookingCancelled
        terminal: true
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: cancelledAt
            type: datetime
            required: true
          - name: reason
            type: CancellationReason
            required: true
      - name: VenueBookingRejected
        params:
          - name: venueBookingId
            type: VenueBookingId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: rejectedAt
            type: datetime
            required: true
          - name: reason
            type: string
            required: true
    note: 収容人数は venueCapacity として Meetup に供給するだけで、定員がそれを超えないことを守るのは Meetup 側の責任（D7）。また「一つのミートアップに一件だけ」はミートアップ単位でしか判定できず、押さえ一件の中では守れない（Q4）。
  - name: AttendanceSheet
    ctx: check-in
    purpose: 開催日当日に「誰が来たか」を、その場で迷わず記録し、締め切った時点で動かない事実として残す。
    background: "当日の受付は数分に人が集中し、会場の電波も怪しい。主催者は行列を止めずに記録する必要があるので、\n複雑な判断をその場に持ち込めない。判断は前日までに終えておき、当日は「名簿にいる人にチェックを付ける」\nだけにするのが現実的である。締め切ったあとの名簿は、次回の案内や常連の把握の土台になる。\n"
    constraints:
      - 受付できるのは、そのミートアップの参加確定者だけ
      - 同じ参加者を二重に受付しない
      - 受付を開始できるのは開催が確定しているミートアップだけ
      - 締切後は出欠を書き換えない
    states:
      - PREPARED
      - OPEN
      - CLOSED
    transitions:
      - from: NONE
        to: PREPARED
        via: PrepareAttendanceSheet
        when: 開催が確定して参加確定者の一覧が固まったとき
      - from: PREPARED
        to: OPEN
        via: OpenCheckIn
        when: 主催者が当日の受付を始めたとき
      - from: OPEN
        to: CLOSED
        via: CloseCheckIn
        when: 主催者が受付を締め切ったとき
    attrs:
      - name: attendanceSheetId
        type: AttendanceSheetId
        required: true
      - name: meetupId
        type: MeetupId
        required: true
      - name: entries
        type: array<AttendanceEntry>
        required: true
        note: 参加確定者一人につき一行。出席・欠席・未確定のいずれかを持つ
      - name: openedAt
        type: datetime
        required: false
      - name: closedAt
        type: datetime
        required: false
      - name: state
        type: AttendanceSheetState
        required: true
    events:
      - name: CheckInOpened
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: openedAt
            type: datetime
            required: true
          - name: expectedAttendeeCount
            type: int
            required: true
      - name: AttendeeCheckedIn
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
          - name: checkedInAt
            type: datetime
            required: true
      - name: CheckInClosed
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: closedAt
            type: datetime
            required: true
          - name: checkedInCount
            type: int
            required: true
      - name: AttendeeMarkedNoShow
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
      - name: AttendanceSheetPrepared
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: entryCount
            type: int
            required: true
            note: 開催確定時点の参加確定者数
      - name: AttendeeAddedToSheet
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
      - name: AttendeeDroppedFromSheet
        params:
          - name: attendanceSheetId
            type: AttendanceSheetId
            required: true
          - name: meetupId
            type: MeetupId
            required: true
          - name: memberId
            type: MemberId
            required: true
queries:
  - name: MeetupCapacityStatus
    ctx: registration
    purpose: 定員に対して今どれだけ埋まっているか、開催に足りているかを一目で示す。主催者の開催可否判断と、参加者の「まだ入れるか」の両方に使う。
    users: 主催者・参加者
    sources:
      - Registration
      - Meetup
    formula: 残席 = 定員 − 確定済み申込件数 ／ 開催可否の目安 = 確定済み申込件数 ≥ 最少催行人数
  - name: WaitlistHead
    ctx: registration
    purpose: 空席が生まれたときに次に繰り上げるべき一件を決める。
    users: 繰り上げポリシー
    sources:
      - Registration
    formula: 状態が WAITLISTED の申込のうち appliedAt が最も早い一件
  - name: LiveRegistrationsOfMeetup
    ctx: registration
    purpose: そのミートアップに対して生きている申込（確定・待ち）の一覧。中止時の一括無効化と、参加者への一斉通知の宛先に使う。
    users: 中止ポリシー・通知ポリシー
    sources:
      - Registration
    note: 一括処理向けの BULK クエリ
  - name: NotCheckedInAttendees
    ctx: check-in
    purpose: 受付を締め切った時点でまだ受付されていない参加確定者の一覧。欠席として記録する対象になる。
    users: 欠席記録ポリシー
    sources:
      - AttendanceSheet
    note: 一括処理向けの BULK クエリ
  - name: CheckInProgress
    ctx: check-in
    purpose: 当日、主催者が「あと何人来ていないか」を把握して開始判断や声かけに使う。
    users: 主催者
    sources:
      - AttendanceSheet
    formula: 受付済み件数 ÷ 参加確定者数
  - name: VenueAvailability
    ctx: venue-booking
    purpose: 候補日ごとに押さえられる会場があるかを示し、仮押さえの判断材料にする。
    users: 主催者
    sources:
      - VenueBooking
    formula: 候補日と枠が重なる TENTATIVE・BOOKED の押さえが存在しない会場
  - name: MeetupOperationOverview
    ctx: meetup-hosting
    purpose: 主催者が抱えている全ミートアップについて、状態・申込の埋まり具合・会場の押さえ状況・仮押さえ期限を一覧で示す。次に手を打つべきミートアップを見つけるための画面。
    users: 主催者
    sources:
      - Meetup
      - Registration
      - VenueBooking
    formula: 要対応の印 = 仮押さえ期限まで3日以内、または募集締切まで3日以内で最少催行人数に未達
    note: 3つの BC をまたぐ読み取り専用モデル
questions:
  - id: Q1
    topic: 募集締切と、開催するかどうかを決める締切は同じ日か別か
    why: 同じなら Meetup が持つ締切は1つでよいが、別なら「申込は締め切ったが開催可否はまだ」という状態が必要になり、公開中の意味が変わる。
    status: open
    note: '[有識者相談推奨] 主催者に聞く質問文: 「参加者の申込を締め切る日と、あなたが開催するか決める日は、同じ日ですか？ 別の日ですか？」 — 現在は applicationDeadline 一本で仮置きしている。'
  - id: Q2
    topic: 仮押さえの失効を誰が検知するか
    why: ExpireVenueHold という遷移は置いたが、それを起こす引き金がモデルに無い。時刻で自動失効させるのか、主催者が気づいた時点で失効扱いにするのかで、必要な仕組みが変わる。
    status: open
  - id: Q3
    topic: 直前に繰り上がった参加者へ承諾を求めるか
    why: 自動で確定にすると、行けなくなっていた人が確定席を持ったまま欠席し、席が二重に無駄になる。承諾を求めると空席が埋まるまで遅くなる。
    status: open
  - id: Q4
    topic: ミートアップ単位でしか守れない制約（定員超過・二重申込・押さえの一意性）を、実装でどう担保するか
    why: 参加申込も会場予約も一件ぶんの粒度で設計したため、件数や一意性という「まとめて見ないと分からない制約」は集約の中では守れない。楽観ロックか、ミートアップ単位の席台帳か、方式の選択が要る。
    status: open
actions:
  - id: A1
    text: 募集締切と開催可否を決める締切が同じか別かを主催者に確認する（Q1）。別なら Meetup に締切を2つ持たせる。
    owner: 主催者ヒアリング
    done: false
  - id: A2
    text: 仮押さえ期限切れを検知する時刻トリガーのポリシーをモデルに追加するか決める（Q2）。
    done: false
  - id: A3
    text: 繰り上がった参加者への承諾確認が要るかを、実際の参加者数名に聞いて決める（Q3）。
    done: false
  - id: A4
    text: 有料開催を扱う場合に備え、payment を別 BC として足す前提で D1 を再検討する。
    done: false
  - id: A5
    text: Q4（ミートアップ単位の制約の担保方式）を設計フェーズの最初の論点として持ち込む。
    done: false
