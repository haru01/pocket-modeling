session:
  id: eventstorming-20260905-1311
  domain: ミートアップ開催運営
  phase: '7'
  status: 完了（フェーズ7）— 構造チェック19観点 clean、意味チェック6観点の指摘を反映済み。未確認事項 Q1〜Q4 は open のまま
  goal: 主催者が企画から当日受付まで、開催可否と定員をどう判断・運用するかを明らかにする（参加費は無料のみ、開催後の振り返りはスコープ外）
  started_at: 2026-09-05T13:11
  html_link: ../../dist/eventstorming/eventstorming-20260905-1311.html
narratives:
  - id: happy
    kind: happy
    title: ハッピーパス — 企画から当日受付完了まで
    entry: 主催者がミートアップを企画する
    prose: "主催者は次のミートアップを企画するところから始める。テーマと開催日の候補、想定人数を決めて下書きを作り、\n候補日に空いている会場を探して仮押さえする。会場が押さえられたら、その会場の収容人数を上限として定員と\n最少催行人数を決め、募集を公開する。\n\n公開されたミートアップには参加者が申し込む。空席がある限り申込はその場で参加確定となり、参加者には\n参加確定が伝わる。申込が最少催行人数に達したら、主催者は開催を確定する。開催が確定した時点で、\n仮押さえだった会場は本予約に切り替わり、確定済みの参加者全員に開催確定が通知される。ここから先は\n主催者が気軽に日程や会場を変えられない状態になる。\n\n開催日当日、主催者は会場で受付を開始する。参加者は受付を済ませ、出席として記録される。開始時刻を過ぎて\n主催者が受付を締め切ると、受付されなかった参加者は欠席として記録される。最後に主催者がミートアップを\n開催完了として締め、当日の出欠が確定した名簿が残る。\n"
  - id: alt-waitlist
    kind: alt
    title: 代替シナリオ — 満席でキャンセル待ちから繰り上がる
    entry: 参加者がミートアップに申し込む
    prose: 定員が埋まったあとに申し込むと、参加確定ではなくキャンセル待ちとして受け付けられる。先に参加確定していた誰かが申込を取り消すと空席が生まれ、キャンセル待ちの先頭の参加者が自動的に繰り上げられて参加確定になる。繰り上がった参加者にはその旨が通知される。受付開始後は繰り上げを行わない。
  - id: alt-undersubscribed
    kind: alt
    title: 代替シナリオ — 最少催行人数に届かず中止する
    entry: 主催者がミートアップを中止する
    prose: 募集締切の時点で申込が最少催行人数に届かなかった場合、主催者はミートアップを中止する。中止すると、仮押さえしていた会場は解放され、申込済みの参加者は全員キャンセル扱いになり、中止が通知される。開催確定後の中止も同じ扱いだが、本予約済みの会場を解放するため主催者の負担は大きい。
  - id: alt-venue-unavailable
    kind: alt
    title: 代替シナリオ — 会場が押さえられず日程を組み直す
    entry: 主催者が会場を仮押さえする
    prose: 候補日に空いている会場が見つからない、または仮押さえの期限内に会場側の承諾が得られなかった場合、仮押さえは失効する。ミートアップは下書きのまま募集を公開できず、主催者は開催日か会場の候補を変えて仮押さえをやり直す。
scenarios:
  - name: 主催者がミートアップを企画する
    ctx: meetup-hosting
    actor: Organizer
    cmd: DraftMeetup
    evt: MeetupDrafted
    agg: Meetup
    next: 主催者が会場を仮押さえする
  - name: 主催者が会場を仮押さえする
    ctx: venue-booking
    actor: Organizer
    cmd: RequestVenueHold
    agg: VenueBooking
    brMode: exclusive
    brs:
      - cond: 候補日にその会場が空いている
        evt: VenueHeld
        next: 主催者が募集を公開する
      - cond: 候補日と枠が重なる押さえがすでに存在する
        evt: VenueHoldRejected
        terminal: alt-venue-unavailable
    qry:
      - VenueAvailability
    errs:
      - cond: 候補日と枠が重なる押さえがすでに存在する
        err: VenueUnavailable
        when: 人気の会場を他の主催者と取り合ったとき
    rules:
      - rule: a meetup must not hold more than one live venue hold
        why: 同じ回で二つの会場を押さえたままにすると、片方を解放し忘れて他の主催者から会場を奪ったままになる。
        note: ミートアップ単位でしか判定できない制約（Q4）
      - rule: a venue hold must carry a deadline
        why: 期限の無い押さえは、会場側から見れば無期限の空き潰しになる。押さえたまま忘れられることを防ぐ。
  - name: 主催者が募集を公開する
    ctx: meetup-hosting
    actor: Organizer
    cmd: PublishMeetup
    evt: MeetupPublished
    agg: Meetup
    pivotal: true
    next: 参加者がミートアップに申し込む
    rules:
      - rule: capacity must not exceed the held venue capacity
        why: 会場に入りきらない人数を受け付けると、当日入れない参加者が出る。会場の収容人数が定員の天井になる。
      - rule: minimumAttendees must be less than or equal to capacity
        why: 開催の下限が上限を超えていると、どうやっても開催できない募集になってしまう。
      - rule: meetup must have a live venue hold before publishing
        why: 会場が取れていないのに募集をかけると、あとで日程ごと作り直すことになり参加者の予定を二度壊す。
    errs:
      - cond: 会場の仮押さえが無い、または失効している
        err: VenueHoldNotAlive
        when: 会場探しより先に告知を出そうとしたとき、または仮押さえ期限を過ぎたまま公開しようとしたとき
      - cond: 定員が会場の収容人数を超えている
        err: CapacityExceedsVenueCapacity
        when: 前回より広い会場を想定したまま定員だけ先に決めていたとき
      - cond: すでに募集中または開催確定である
        err: MeetupAlreadyPublished
        when: 公開後に内容を直して再公開しようとしたとき
  - name: 参加者がミートアップに申し込む
    ctx: registration
    actor: Member
    cmd: ApplyForMeetup
    agg: Registration
    brMode: exclusive
    brs:
      - cond: 確定済み申込が定員に達していない
        evt: RegistrationConfirmed
        next: 主催者がミートアップの開催を確定する
      - cond: 確定済み申込が定員に達している
        evt: RegistrationWaitlisted
        next: 参加者が申込を取り消す
    qry:
      - MeetupCapacityStatus
    rules:
      - rule: confirmed registrations must never exceed the meetup capacity
        why: 定員は会場に入れる人数そのものなので、一件でも超えると当日に立ち見か門前払いが発生する。
        note: 定員という数字は Meetup が持ち、席の配分は Registration が担うため、この不変条件は 2 つの集約にまたがる。守り方は D7 で決めた。
      - rule: a member must not hold more than one live registration per meetup
        why: 同じ人が二重に席を取ると、待っている人の順番が不当に後ろへ押しやられる。
      - rule: applications must not be accepted outside the published period
        why: 締切後の申込を受けると、主催者が確定した人数の上に後から人が乗ることになり開催の準備がやり直しになる。
    errs:
      - cond: ミートアップが募集中でない
        err: MeetupNotOpenForApplication
        when: 中止されたミートアップのリンクを SNS 経由で踏んだとき
      - cond: 同じ参加者の生きた申込がすでにある
        err: DuplicateRegistration
        when: 申込完了メールに気づかず二度申し込んだとき
      - cond: 募集締切を過ぎている
        err: ApplicationDeadlinePassed
        when: 締切当日の夜に思い立って申し込もうとしたとき
  - name: 参加者が申込を取り消す
    ctx: registration
    actor: Member
    cmd: CancelRegistration
    evt: RegistrationCancelled
    agg: Registration
    rules:
      - rule: cancellations must not be accepted after the cancellation deadline
        why: 締切を過ぎた取消は繰り上げが間に合わず、席が空いたという記録だけが残って会場には空席ができる。参加者にも「いつまでなら降りられるか」がはっきり伝わる。
        note: 以前は「受付が始まっていないこと」を条件にしていたが、当日受付という別の文脈の状態に依存してしまうため、ミートアップが持つ時刻で判断する形にした（D8）
    errs:
      - cond: 取消締切を過ぎている
        err: CancellationDeadlinePassed
        when: 当日の朝に行けなくなったと気づいたとき
      - cond: 申込がすでに取消済みまたは無効化済み
        err: RegistrationNotCancellable
        when: 中止済みのミートアップの申込を取り消そうとしたとき
  - name: 主催者がミートアップの開催を確定する
    ctx: meetup-hosting
    actor: Organizer
    cmd: ConfirmMeetup
    agg: Meetup
    pivotal: true
    qry:
      - MeetupCapacityStatus
    rules:
      - rule: confirmed registrations must reach minimumAttendees
        why: 人が集まらないまま開催すると、来てくれた数人にも主催者にも割に合わない会になる。最少催行人数は「やる価値がある」の線引きそのもの。
      - rule: the venue hold must still be alive at confirmation time
        why: 仮押さえが失効したまま開催確定を告知すると、会場のない確定という最悪の状態になる。
    errs:
      - cond: 確定済み申込が最少催行人数に届かない
        err: BelowMinimumAttendees
        when: 締切間際になっても人数が集まらなかったとき
      - cond: 会場の仮押さえが失効している
        err: VenueHoldNotAlive
        when: 人数は集まったが会場側の返事を待つうちに期限を過ぎていたとき
      - cond: すでに開催確定または中止済み
        err: MeetupNotConfirmable
        when: 確定通知が届いたか不安で二度確定操作をしたとき
    brMode: exclusive
    brs:
      - cond: 確定済み申込が最少催行人数に達している
        evt: MeetupConfirmed
        next: システムが会場を本予約に切り替える
      - cond: 募集締切を過ぎても最少催行人数に届かない
        evt: MinimumAttendeesNotMet
        next: 主催者がミートアップを中止する
        note: 開催確定は成立せず、人数が足りないという事実だけが残る。主催者はこれを見て中止を判断する
  - name: 主催者がミートアップを中止する
    ctx: meetup-hosting
    actor: Organizer
    cmd: CancelMeetup
    evt: MeetupCancelled
    agg: Meetup
    rules:
      - rule: cancellation must not be applied to a meetup that is already held
        why: 開催してしまった事実は取り消せない。当日の出欠が残っているミートアップを中止に戻せると、参加した人の記録が宙に浮く。
        note: 逆に開催確定後でも中止できる道は残す。会場が使えなくなる事情は確定後にも起きるため
      - rule: cancellation must not be applied twice
        why: 二度目の中止で参加者に同じ知らせがもう一度届き、別の回まで中止になったのかと混乱させる。
    errs:
      - cond: すでに開催完了している
        err: MeetupAlreadyHeld
        when: 前回の回と間違えて中止操作をしたとき
      - cond: すでに中止済み
        err: MeetupAlreadyCancelled
        when: 中止を伝えたか不安になって二度操作したとき
    next: システムが中止に伴い会場を手放す
  - name: 主催者が当日の受付を開始する
    ctx: check-in
    actor: Organizer
    cmd: OpenCheckIn
    evt: CheckInOpened
    agg: AttendanceSheet
    next: 参加者が会場で受付する
    rules:
      - rule: check-in must not be opened for a meetup that is not confirmed
        why: 開催が確定していないミートアップの受付を開けると、参加者の一覧が確定しないまま出欠を取ることになる。
      - rule: check-in must not be opened twice
        why: 開いた時刻が上書きされると、実際に何時から受付を始めたのかが記録から消える。
    errs:
      - cond: ミートアップが開催確定でない
        err: MeetupNotConfirmed
        when: 中止したミートアップの画面を当日そのまま開いてしまったとき
      - cond: すでに受付が開始されている
        err: CheckInAlreadyOpened
        when: 会場の電波が悪く、開始操作が通ったか分からず二度押したとき
  - name: 参加者が会場で受付する
    ctx: check-in
    actor: Member
    cmd: CheckInAttendee
    evt: AttendeeCheckedIn
    agg: AttendanceSheet
    next: 主催者が受付を締め切る
    qry:
      - NotCheckedInAttendees
    rules:
      - rule: only confirmed attendees can be checked in
        why: キャンセル待ちのまま来た人を受付に通すと、定員を超えた人数が会場に入る。
      - rule: an attendee cannot be checked in twice
        why: 出席者数が実際より多く見え、次回の会場選びを誤らせる。
    errs:
      - cond: 受付が開始されていない
        err: CheckInNotOpen
        when: 開場前に着いた参加者がその場で受付を試したとき
      - cond: 参加確定者でない
        err: NotConfirmedAttendee
        when: キャンセル待ちのまま当日会場に来たとき
      - cond: すでに受付済み
        err: AlreadyCheckedIn
        when: 一度外に出た参加者が戻ってきて再度受付したとき
  - name: 主催者が受付を締め切る
    ctx: check-in
    actor: Organizer
    cmd: CloseCheckIn
    evt: CheckInClosed
    agg: AttendanceSheet
    next: 主催者がミートアップを開催完了する
    errs:
      - cond: 受付が開始されていない
        err: CheckInNotOpen
        when: 受付を開く前に締切ボタンに触れてしまったとき
      - cond: すでに受付が締め切られている
        err: CheckInAlreadyClosed
        when: 通信が不安定で締切操作を二度送ってしまったとき
    rules:
      - rule: check-in must not be closed twice
        why: 二度目の締切を許すと、一度確定した出欠の上に「まだ受付中だった」という記録が重なり、名簿がどの時点の事実か分からなくなる。
  - name: 主催者がミートアップを開催完了する
    ctx: meetup-hosting
    actor: Organizer
    cmd: CloseMeetup
    evt: MeetupHeld
    agg: Meetup
    pivotal: true
    rules:
      - rule: a meetup must not be closed before check-in is closed
        why: 出欠が固まる前に締めると、あとから来た人の記録が残せず名簿が実態と食い違う。
    errs:
      - cond: 受付がまだ締め切られていない
        err: CheckInNotClosed
        when: 懇親会に流れたまま受付を開いたことを忘れ、翌日まとめて締めようとしたとき
  - name: システムが仮押さえの期限切れを検知する
    ctx: venue-booking
    actor: System
    cmd: ExpireVenueHold
    evt: VenueHoldExpired
    agg: VenueBooking
    note: Q2 が未決のため仮置き。時刻での自動検知を前提にしている。主催者が気づいた時点で失効させる運用なら actor は Organizer になる。
    rules:
      - rule: an expired hold must not be treated as a live hold
        why: 失効した押さえを生きているものとして扱うと、会場の無いミートアップの募集が続き、参加者が集まるほど傷が深くなる。
  - name: システムが中止に伴い会場を手放す
    ctx: venue-booking
    actor: System
    cmd: ReleaseVenue
    agg: VenueBooking
    brMode: exclusive
    brs:
      - cond: まだ仮押さえのままである
        evt: VenueHoldReleased
        note: 会場側への連絡は不要か軽い
      - cond: すでに本予約になっている
        evt: VenueBookingCancelled
        note: 会場側にキャンセル連絡が必要で、キャンセル料が発生することもある
    rules:
      - rule: a venue must be released whenever its meetup is cancelled
        why: 会場を握ったまま中止にすると、その枠は誰にも使われないまま消える。会場提供者との信頼にも関わる。
  - name: システムが会場を本予約に切り替える
    ctx: venue-booking
    actor: System
    cmd: ConfirmVenueBooking
    agg: VenueBooking
    brMode: exclusive
    brs:
      - cond: 仮押さえが生きていて会場側が本予約を受け付ける
        evt: VenueBookingConfirmed
        next: 主催者が当日の受付を開始する
      - cond: 仮押さえが失効している、または会場側に断られた
        evt: VenueBookingRejected
        next: 主催者がミートアップを中止する
        note: 開催確定済みなのに会場が無いという最も痛い状態。参加者にはまだ確定を伝えていないので、中止に倒して伝え直す
    rules:
      - rule: a booking must not be confirmed on an expired or released hold
        why: 失効した押さえの上に本予約を重ねると、会場側では空いている枠に、こちらだけが予約済みだと思い込む。
    errs:
      - cond: 仮押さえがすでに失効している
        err: VenueHoldNotAlive
        when: 開催確定が期限ぎりぎりで、切り替えの直前に期限を過ぎたとき
      - cond: 会場側が本予約を断った
        err: VenueBookingRefusedByVenue
        when: 会場の都合が押さえたあとに変わったとき
  - name: システムがキャンセル待ちを繰り上げる
    ctx: registration
    actor: System
    qry:
      - WaitlistHead
    cmd: PromoteWaitlistedRegistration
    evt: RegistrationPromoted
    agg: Registration
    rules:
      - rule: promotion must not happen after the cancellation deadline
        why: 締切後に繰り上げても、繰り上がった本人が予定を空けられず結局来られない。空席を埋める効果が無いまま期待だけ持たせることになる。
      - rule: promotion must follow the waitlist order
        why: 順番を飛ばすと先着順という約束が崩れ、待っている人が納得できなくなる。
    errs:
      - cond: 取消締切を過ぎている
        err: PromotionDeadlinePassed
        when: 締切後の中止に伴う無効化が走ったとき
      - cond: キャンセル待ちが一人もいない
        err: NoWaitlistedRegistration
        when: 定員に余裕があるまま誰かが取り消したとき
  - name: システムが繰り上がった参加者を名簿に載せる
    ctx: check-in
    actor: System
    cmd: EnrollAttendeeOnSheet
    evt: AttendeeAddedToSheet
    agg: AttendanceSheet
    rules:
      - rule: an attendee must not be enrolled on a sheet that has been closed
        why: 締め切った名簿に後から人を足すと、その日の出欠という確定した事実が後で書き換わる。
    errs:
      - cond: 名簿がまだ用意されていない
        err: AttendanceSheetNotPrepared
        when: 開催確定より前に繰り上げが起きたとき
      - cond: すでに受付が締め切られている
        err: AttendanceSheetAlreadyClosed
  - name: システムが取り消した参加者を名簿から外す
    ctx: check-in
    actor: System
    cmd: DropAttendeeFromSheet
    evt: AttendeeDroppedFromSheet
    agg: AttendanceSheet
    rules:
      - rule: an attendee must not be dropped from a sheet that has been closed
        why: 締切後に名簿から人を消すと、当日その人が来ていた事実まで消える。
    errs:
      - cond: 名簿がまだ用意されていない
        err: AttendanceSheetNotPrepared
        when: 開催確定より前に取消が起きたとき（大半の取消はこちら）
      - cond: すでに受付が締め切られている
        err: AttendanceSheetAlreadyClosed
