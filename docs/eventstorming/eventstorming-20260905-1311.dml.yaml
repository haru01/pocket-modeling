    description: "**一回の開催そのもの**を扱う。テーマ・日時・定員・最少催行人数を決め、募集を公開し、開催するかどうかを決め、最後に開催完了として締めるまでを持つ。\n\n- **境界の理由**: 「このミートアップを開催するか」という判断は主催者だけのものであり、申込の増減や当日の受付の都合で揺らしたくない。判断の材料は他の文脈から受け取るが、決めるのはここに閉じる。\n- **含むシナリオ**: 企画する / 募集を公開する / 開催を確定する / 中止する / 開催完了する\n- **目的**: 主催者が「開催する・しない」を、根拠を持って一度だけ決められるようにする\n- **制約**: 定員は会場の収容人数を超えられない。開催確定後は日時と会場を変更できない\n"
