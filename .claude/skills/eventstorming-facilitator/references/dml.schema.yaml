# DML (Domain Modeling Language) JSON Schema — Draft 2020-12
#
# DML は YAML 形式のドメインモデル（contexts / aggregates / scenarios / policies の 4 リスト + 任意の
# domains / decisions）。
# v3 で AGG をトップレベル `aggregates[]` に切り出した（旧 v2 の `contexts[].aggs[]` 内 dict 形式は廃止）。
# v4 で「意思決定ログ（採用/不採用理由）」を `decisions[]` トップレベルとして追加。
# v6 でトップレベル `flows[]` を廃止し、`scenarios[].next` / `brs[].next` / `brs[].terminal` の
# 連鎖と `narratives[].entry` + `narratives[].kind` の組み合わせでフローを表現するモデルに移行。
# HTML §3 フロー図は narratives[] の各エントリを起点に scenarios[].next を辿り、
# 途中で scenarios[].evt → policies[].trg をマッチさせて policy を自動挿入して生成される
# （旧 event-flow-svg DSL は廃止）。
# このスキーマは「構文 validity（形が正しいか）」のみを機械検証する。
# 「意味 validity（参照の実在・因果整合・モデル品質）」は causal-check / quality-check が担う。
# スキーマ通過は必要条件であって十分条件ではない。
#
# 検証例:
#   import yaml; from jsonschema import Draft202012Validator
#   schema = yaml.safe_load(open(".../references/dml.schema.yaml"))
#   doc = yaml.safe_load(open("docs/eventstorming/<session>.dml.yaml"))  # None も許容
#   list(Draft202012Validator(schema).iter_errors(doc))
#
# 構造の要点:
#   - `contexts[].aggs` は AGG 名の軽量名簿（PascalCase 文字列のリスト）
#   - 詳細はトップレベル `aggregates[]` に集約: name / ctx（所属 BC）/ purpose / states /
#     transitions（from→to via cmd）/ attrs（ペイロード属性）/ events（emit する EVT 宣言）
#
# 拡張フィールド（type/vision/resp/sub/roles/prRoles/brMode/trgs/domains 等）はすべて optional。
# 進行中セッション（多くの項目が空）でも valid。
#
# 命名方針:
#   - トップレベルキーは略語禁止（contexts / aggregates / scenarios / policies / queries /
#     decisions / questions / actions / narratives / domains / session）
#   - 散文は narratives[] に一本化。ハッピーパスは kind: happy のエントリ、代替は kind: alt
#     （旧トップレベル `story:` は v8 で廃止）
#   - ネストの短いキー（name/type/vision/note/lang/mod/qry/cmd/evt/agg/pol 等）は維持
#   - 主なネスト略語: ctx / aggs / sub(s) / up / dn / rel / prRoles / brMode / brs /
#     cond / err / errs / resp / tech / trg / trgs / evts / cmds / lang / mod / via

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pocket-modeling/schemas/dml.schema.yaml"
title: DML Document

# トップレベルは object。必須キーは無い（空 {} も valid）。
# 全行コメントのみの .dml.yaml は yaml.safe_load で None になるが、これは検証ツール層
# （validate_dml.py / ビルダー）が「未記述」として検証前にスキップする（進行中セッション許容）。
# スキーマを object に固定することで、違反が (root) に潰れず深いパス（例 scenarios/3/cmd）で報告される。
type: object
additionalProperties: false
properties:
  domains:
    type: array
    items: { $ref: "#/$defs/domain" }
  contexts:
    type: array
    items: { $ref: "#/$defs/context" }
  aggregates:
    type: array
    items: { $ref: "#/$defs/aggregate" }
  scenarios:
    type: array
    items: { $ref: "#/$defs/scenario" }
  policies:
    type: array
    items: { $ref: "#/$defs/policy" }
  decisions:                                   # 要素⑥・任意（意思決定ログ：採用/不採用理由）
    type: array
    items: { $ref: "#/$defs/decision" }
  # v5: MD 廃止に伴い散文・セッションメタ・Q/QRY/アクションを DML 内に統合（すべて任意）
  session:                                     # セッションメタ（旧 .md ヘッダー相当）
    $ref: "#/$defs/session"
  narratives:                                  # ハッピーパス＋代替シナリオ散文（旧 .md §1〜§2）
    type: array
    items: { $ref: "#/$defs/narrative" }
  questions:                                   # オープンクエスチョン（旧 .md §5 / Q1..Qn）
    type: array
    items: { $ref: "#/$defs/question" }
  actions:                                     # 次のアクション（旧 .md §4）
    type: array
    items: { $ref: "#/$defs/action" }
  queries:                                     # リードモデル候補カード（旧 .md §9）
    type: array
    items: { $ref: "#/$defs/qry" }

$defs:

  # ---------- 識別子パターン ----------
  contextName:
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"   # lowercase-with-hyphen
  pascalCase:
    type: string
    pattern: "^[A-Z][A-Za-z0-9]*$"             # cmd / evt / agg / qry / actor / error
  upperSnake:
    type: string
    pattern: "^[A-Z][A-Z0-9_]*$"               # AGG の状態名（DRAFT / PUBLISHED 等）

  # ---------- enum 群 ----------
  relationshipPattern:                          # 粗い relationship（既存 4 + CML 由来 4）
    type: string
    enum:
      - Customer-Supplier      # v1
      - Conformist             # v1
      - Shared-Kernel          # v1
      - ACL                    # v1
      - Partnership            # +CML
      - Upstream-Downstream    # +CML
      - Open-Host-Service      # +CML
      - Published-Language     # +CML
  relationshipRole:                             # CML ショートコード（roles / prRoles 要素）
    type: string
    enum: [U, D, S, C, OHS, PL, ACL, CF, SK, P]
  subdomainType:
    # subs[] 配下のサブドメイン種別。3 値とも `_SUBDOMAIN` で揃え（フィールド名 `subs` と整合）、
    # `CORE_DOMAIN` / `SUPPORTING_DOMAIN` の旧表記との混在で typo を踏まないようにする。
    # 旧表記（CORE_DOMAIN / SUPPORTING_DOMAIN）も後方互換として許容する。
    type: string
    enum:
      - CORE_SUBDOMAIN
      - SUPPORTING_SUBDOMAIN
      - GENERIC_SUBDOMAIN
      - CORE_DOMAIN           # 後方互換: ≤ v6 で書かれた既存セッション用
      - SUPPORTING_DOMAIN     # 後方互換: ≤ v6 で書かれた既存セッション用
  bcType:
    type: string
    enum: [FEATURE, APPLICATION, SYSTEM, MICROSERVICE]
  branchMode:
    type: string
    enum: [exclusive, concurrent, inclusive]    # X / + / O

  # ---------- Domain / Subdomain（要素②・任意） ----------
  domain:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/contextName" }
      vision: { type: string }
      subs:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { $ref: "#/$defs/contextName" }
            type: { $ref: "#/$defs/subdomainType" }
            vision: { type: string }

  # ---------- リレーションエントリ（要素①） ----------
  relationshipEntry:
    type: object
    additionalProperties: false
    required: [ctx]
    properties:
      ctx: { $ref: "#/$defs/contextName" }
      rel: { $ref: "#/$defs/relationshipPattern" }            # v1・任意
      roles:                                                  # 自 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      prRoles:                                                # 相手 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      note: { type: string }

  # ---------- 属性（AGG / EVT のペイロード要素） ----------
  attribute:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: "^[a-z][A-Za-z0-9]*$"        # camelCase（slug ではなくフィールド名）
      type: { type: string }                   # string / int / date / <AggName>Id 等（自由文字列）
      required: { type: boolean }
      note: { type: string }

  # ---------- 状態遷移 ----------
  transition:
    type: object
    additionalProperties: false
    required: [from, to, via]
    properties:
      from: { $ref: "#/$defs/upperSnake" }
      to:                                       # 単一 or 配列（分岐先）
        oneOf:
          - { $ref: "#/$defs/upperSnake" }
          - type: array
            items: { $ref: "#/$defs/upperSnake" }
      via: { $ref: "#/$defs/pascalCase" }       # トリガー CMD（scenarios[].cmd と一致）
      when: { type: string }                    # 日本語補足
      note: { type: string }

  # ---------- AGG が emit するイベント宣言 ----------
  eventMeta:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      params:
        type: array
        items: { $ref: "#/$defs/attribute" }
      terminal:                                  # v7・true なら orphan_event 検出から除外
        type: boolean                            # （業務的に「ここで止まる」失敗系/タイムアウト系 EVT 用）
      note: { type: string }

  # ---------- Aggregate（トップレベル `aggregates` の要素） ----------
  aggregate:
    type: object
    additionalProperties: false
    required: [name, ctx]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      ctx: { $ref: "#/$defs/contextName" }     # 所属 BC（必須・contexts[].aggs と双方向参照）
      purpose: { type: string }
      background: { type: string }              # 「なぜ今この AGG を切り出すか」（v4・任意）
      constraints:                              # 業務/法令/プラットフォーム由来の制約（v4・任意）
        type: array
        items: { type: string }
      states:
        type: array
        items: { $ref: "#/$defs/upperSnake" }
      transitions:
        type: array
        items: { $ref: "#/$defs/transition" }
      attrs:
        type: array
        items: { $ref: "#/$defs/attribute" }
      events:                                   # この AGG が emit する EVT 宣言
        type: array
        items: { $ref: "#/$defs/eventMeta" }
      note: { type: string }

  # ---------- Context（BC 宣言） ----------
  context:
    type: object
    additionalProperties: false
    required: [name]                            # name のみ必須（lang 無しの BC が実在）
    properties:
      name: { $ref: "#/$defs/contextName" }
      # --- 拡張メタ（要素④・任意） ---
      type: { $ref: "#/$defs/bcType" }
      label_ja: { type: string }                # v5・BC の日本語短縮名（HTML 見出しで `fulfillment（物流）` のように併記）
      vision: { type: string }
      description: { type: string }             # v5・BC 散文（旧 .md §7 の「境界の理由・含むシナリオ」用の短い導入）
      purpose: { type: string }                 # v5・BC の目的（HTML §7 にオレンジ "目的" ブロックで描画）
      background: { type: string }              # v5・BC の背景（HTML §7 に青 "背景" ブロックで描画）
      constraints:                              # v5・BC の制約（HTML §7 に紫 "制約" リストで描画）
        type: array
        items: { type: string }
      resp:                                     # 文字列 or 文字列配列
        oneOf:
          - type: string
          - type: array
            items: { type: string }
      tech: { type: string }
      sub: { $ref: "#/$defs/contextName" }      # 要素②・軽量参照
      aggs:                                     # AGG 名の軽量名簿（詳細はトップレベル aggregates[] へ）
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      # --- v1 既存 ---
      # lang は本 BC で扱う語彙の英→日辞書。
      # カテゴリ別 dict-of-dicts 形式: { aggs / actors / cmds / evts / pols / qrys / vos: { EnId: jp } }。
      # HTML §7 のタイプ別表と glossary_index（フロー図ラベル日本語化）がここから生成される。
      lang:
        type: object
        additionalProperties: false
        properties:
          aggs:    { type: object, additionalProperties: { type: string } }
          actors:  { type: object, additionalProperties: { type: string } }
          cmds:    { type: object, additionalProperties: { type: string } }
          evts:    { type: object, additionalProperties: { type: string } }
          pols:    { type: object, additionalProperties: { type: string } }
          qrys:    { type: object, additionalProperties: { type: string } }
          vos:     { type: object, additionalProperties: { type: string } }
          states:  { type: object, additionalProperties: { type: string } }     # v5・AGG 状態名（UPPER_SNAKE）の日本語ラベル
      mod: { type: string }
      up:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      dn:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      note: { type: string }

  # ---------- Rule / Error ----------
  rule:
    type: object
    additionalProperties: false
    required: [rule]
    properties:
      rule: { type: string }     # 英語の不変条件（自然文）
      why: { type: string }
      note: { type: string }
  error:
    type: object
    additionalProperties: false
    required: [cond, err]
    properties:
      cond: { type: string }
      err: { $ref: "#/$defs/pascalCase" }
      when: { type: string }
      note: { type: string }

  # ---------- Branch（要素③） ----------
  # next/terminal はフロー連鎖を駆動する追加属性（v6）:
  #   - next: この分岐が発火した直後に進む scenarios[].name（同一フロー内継続）
  #   - terminal: この分岐がフロー終端（narratives[].id を指定して「このフローはここで終わる」と宣言）
  # next と terminal は排他。terminal: <flow_id> なら以降は policy 自動挿入のみで終わる。
  branch:
    type: object
    additionalProperties: false
    required: [evt]
    properties:
      cond: { type: string }         # concurrent / inclusive 時は省略可
      evt: { $ref: "#/$defs/pascalCase" }
      pol:
        oneOf:
          - { $ref: "#/$defs/pascalCase" }
          - type: array
            items: { $ref: "#/$defs/pascalCase" }
      next: { type: string }                                # この分岐が発火した時に進む scenarios[].name
      terminal: { $ref: "#/$defs/contextName" }             # この分岐がフロー終端（narratives[].id 参照）
      note: { type: string }
    not:
      required: [next, terminal]                            # next と terminal の同時指定を禁止

  # ---------- Scenario ----------
  # next はフロー連鎖の継続先を表す（v6）:
  #   - 文字列形式: 全フローで同一の次 scenario.name を指す（フロー間で next が共通な時）
  #   - dict 形式:  narratives[].id をキーとし、フロー別に次 scenario.name を指定（分岐点）
  # 省略 → このフロー上で次の scenario が無い（policy 自動挿入のみで終わるか、終端）
  scenario:
    type: object
    additionalProperties: false
    required: [name, ctx, actor]
    properties:
      name: { type: string }                  # 日本語（アクター＋行為）
      ctx: { $ref: "#/$defs/contextName" }
      actor: { $ref: "#/$defs/pascalCase" }
      qry:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }
      evt: { $ref: "#/$defs/pascalCase" }
      brMode: { $ref: "#/$defs/branchMode" }   # 要素③・省略時 exclusive
      brs:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/branch" }
      next:                                    # v6・フロー連鎖の次 scenario（任意）
        oneOf:
          - type: string                                          # 全フロー共通
          - type: object
            additionalProperties: { type: string }                # narratives[].id → 次 scenario.name
            minProperties: 1
      agg: { $ref: "#/$defs/pascalCase" }
      rules:
        type: array
        items: { $ref: "#/$defs/rule" }
      errs:
        type: array
        items: { $ref: "#/$defs/error" }
      pol:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      note: { type: string }
    allOf:
      - not:
          required: [evt, brs]                  # evt と brs の同時指定を禁止
      - if:
          required: [brMode]
        then:
          required: [brs]                       # brMode 単独を禁止

  # ---------- Policy（EVENTUAL-TX） ----------
  policy:
    type: object
    additionalProperties: false
    required: [name, ctx]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      ctx: { $ref: "#/$defs/contextName" }
      trg: { $ref: "#/$defs/pascalCase" }       # v1・単一トリガー
      trgs:                                      # 要素③・複数トリガー join
        type: object
        additionalProperties: false
        required: [evts]
        properties:
          evts:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/pascalCase" }
          mode: { $ref: "#/$defs/branchMode" }
      qry: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }        # 副作用専用 POLICY では省略可
      bulk: { type: boolean }
      evt: { $ref: "#/$defs/pascalCase" }
      agg: { $ref: "#/$defs/pascalCase" }        # v7・POL の cmd が変更する AGG（scenarios と対称化）
      note: { type: string }
    allOf:
      - not:
          required: [trg, trgs]                  # trg と trgs の同時指定を禁止
      - if:
          required: [bulk]
          properties:
            bulk: { const: true }
        then:
          required: [qry]                        # bulk: true のとき qry 必須

  # ---------- Decision / Option（v4・意思決定ログ） ----------
  # 各 decision は「採用したもの + なぜ + 不採用のもの + なぜでない」を構造化して残す。
  # affects[] は影響を受ける AGG / 要素名（PascalCase または contextName）。
  decisionOption:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string }                    # 選択肢の識別ラベル（自由文字列・追跡用 ID。英語推奨）
      label: { type: string }                   # 日本語表示ラベル（任意。HTML レンダリング時に「label (name)」形式で表示）
      adopted: { type: boolean }                # true なら採用（chosen と整合）
      why: { type: string }                     # 採用理由（adopted: true のとき推奨）
      why_not: { type: string }                 # 不採用理由（adopted: false/未指定のとき推奨）
      note: { type: string }
  decision:
    type: object
    additionalProperties: false
    required: [id, topic, chosen, options]
    properties:
      id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"  # e.g. D1 / capacity-owner
      topic: { type: string }                   # 意思決定のテーマ（1 行）
      chosen: { type: string }                  # 採用した options[].name のいずれか
      options:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/decisionOption" }
      affects:                                  # 影響する DML 要素名（任意）
        type: array
        items: { type: string }
      note: { type: string }

  # ---------- Session（v5・セッションメタ：旧 .md ヘッダー相当） ----------
  session:
    type: object
    additionalProperties: false
    properties:
      id: { type: string }                      # セッション ID（例: 20260528-1209）
      domain: { type: string }                  # 対象ドメイン名
      phase:                                    # v7・直近完了フェーズ（構造化）
        type: string                            #     SKILL.md ワークフロー 9 ステップに対応
        enum: ["1", "2", "3", "4", "4.5", "4.6", "5", "6", "7"]
        # HTML 進捗タブはこの値を最優先で参照する。"7" で全完了（最終 ✅）扱い。
        # 未設定なら status 文字列を regex で解釈するレガシー挙動にフォールバック。
      status: { type: string }                  # 補足説明（自由文字列）。タブ表示には使われない（phase が真実源）
      goal: { type: string }                    # 当該セッションのゴール
      started_at: { type: string }              # 開始日時（ISO 8601 推奨）
      html_link: { type: string }               # 生成 HTML の相対パス（任意）
      note: { type: string }

  # ---------- Narrative（v5・散文：旧 .md §1〜§2） ----------
  # v6: フロー定義の起点も兼ねる。`entry` を指定すると HTML §3 でフロー図 1 行を駆動する。
  # entry を持たない narrative はプロセ散文だけのエントリ（フロー図には描画されない）。
  # v8: トップレベル `story:` 廃止に伴い、ハッピーパスは kind: happy のエントリとしてここに統合。
  #     kind を必須化、enum は [happy, alt]。kind: happy は 0 or 1 件（複数指定は narrative-happy-unique で検出）。
  narrative:
    type: object
    additionalProperties: false
    required: [id, kind, prose]
    properties:
      id:                                       # 散文識別子・兼フロー ID（例: happy / alt-rejected）
        $ref: "#/$defs/contextName"
      title: { type: string }                   # 表示用見出し（HTML §1 散文カード／§3 フロー図見出しに使用）
      kind:                                     # フロー種別（HTML §1 では happy が先頭、alt が後続）
        type: string
        enum: [happy, alt]
      entry: { type: string }                   # v6・このフローの開始 scenarios[].name（指定時のみ §3 に描画）
      prose: { type: string }                   # 散文本文
      note: { type: string }

  # ---------- Question（v5・オープンクエスチョン：旧 .md §5 Q1..Qn） ----------
  question:
    type: object
    additionalProperties: false
    required: [id, topic]
    properties:
      id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"  # 例: Q1 / capacity-handover
      topic: { type: string }                   # 確認したい事項（1 行）
      why: { type: string }                     # なぜ確認したいか（任意）
      status:
        type: string
        enum: [open, closed]                    # closed のときは decision_id で D{n} を指す
      decision_id: { type: string }             # closed の場合の対応 decisions[].id
      note: { type: string }

  # ---------- Action（v5・次のアクション：旧 .md §4） ----------
  action:
    type: object
    additionalProperties: false
    required: [id, text]
    properties:
      id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"  # 例: A1 / fill-rules
      text: { type: string }                    # アクション本文
      owner: { type: string }                   # 担当者（任意）
      done: { type: boolean }                   # 完了フラグ（任意・既定 false）
      note: { type: string }

  # ---------- QRY（v5・リードモデル候補カード：旧 .md §9） ----------
  qry:
    type: object
    additionalProperties: false
    required: [name, ctx]
    properties:
      name: { $ref: "#/$defs/pascalCase" }      # QRY 名（PascalCase）
      ctx: { $ref: "#/$defs/contextName" }      # 所属 BC
      purpose: { type: string }                 # 何のために存在する読み取りビューか
      users: { type: string }                   # 利用者（業務ロール）
      sources:                                  # ソース AGG / EVT 等
        type: array
        items: { type: string }
      formula: { type: string }                 # 算出式・絞り込み条件（自然文）
      note: { type: string }
