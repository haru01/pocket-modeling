# DML (Domain Modeling Language) JSON Schema — Draft 2020-12
#
# DML は YAML 形式のドメインモデル（contexts / scenarios / policies の 3 リスト + 任意の domains）。
# このスキーマは「構文 validity（形が正しいか）」のみを機械検証する。
# 「意味 validity（参照の実在・因果整合・モデル品質）」は causal-check / quality-check が担う。
# スキーマ通過は必要条件であって十分条件ではない。
#
# 検証例:
#   import yaml; from jsonschema import Draft202012Validator
#   schema = yaml.safe_load(open(".../references/dml.schema.yaml"))
#   doc = yaml.safe_load(open("docs/eventstorming/<session>.dml.yaml"))  # None も許容
#   list(Draft202012Validator(schema).iter_errors(doc))
#
# 後方互換: 拡張フィールド（type/vision/responsibilities/aggregates/subdomain/roles/
# partnerRoles/branchMode/triggers/domains）はすべて optional。v1 記法は永続的に valid。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pocket-modeling/schemas/dml.schema.yaml"
title: DML Document

# トップレベルは object。必須キーは無い（空 {} も valid）。
# 全行コメントのみの .dml.yaml は yaml.safe_load で None になるが、これは検証ツール層
# （validate_dml.py / ビルダー）が「未記述」として検証前にスキップする（進行中セッション許容）。
# スキーマを object に固定することで、違反が (root) に潰れず深いパス（例 scenarios/3/cmd）で報告される。
type: object
additionalProperties: false
properties:
  domains:
    type: array
    items: { $ref: "#/$defs/domain" }
  contexts:
    type: array
    items: { $ref: "#/$defs/context" }
  scenarios:
    type: array
    items: { $ref: "#/$defs/scenario" }
  policies:
    type: array
    items: { $ref: "#/$defs/policy" }

$defs:

  # ---------- 識別子パターン ----------
  contextName:
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"   # lowercase-with-hyphen
  pascalCase:
    type: string
    pattern: "^[A-Z][A-Za-z0-9]*$"             # cmd / evt / agg / qry / actor / error
  upperSnake:
    type: string
    pattern: "^[A-Z][A-Z0-9_]*$"               # AGG の状態名（DRAFT / PUBLISHED 等）

  # ---------- enum 群 ----------
  relationshipPattern:                          # 粗い relationship（既存 4 + CML 由来 4）
    type: string
    enum:
      - Customer-Supplier      # v1
      - Conformist             # v1
      - Shared-Kernel          # v1
      - ACL                    # v1
      - Partnership            # +CML
      - Upstream-Downstream    # +CML
      - Open-Host-Service      # +CML
      - Published-Language     # +CML
  relationshipRole:                             # CML ショートコード（roles / partnerRoles 要素）
    type: string
    enum: [U, D, S, C, OHS, PL, ACL, CF, SK, P]
  subdomainType:
    type: string
    enum: [CORE_DOMAIN, SUPPORTING_DOMAIN, GENERIC_SUBDOMAIN]
  bcType:
    type: string
    enum: [FEATURE, APPLICATION, SYSTEM, MICROSERVICE]
  branchMode:
    type: string
    enum: [exclusive, concurrent, inclusive]    # X / + / O

  # ---------- Domain / Subdomain（要素②・任意） ----------
  domain:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/contextName" }
      vision: { type: string }
      subdomains:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { $ref: "#/$defs/contextName" }
            type: { $ref: "#/$defs/subdomainType" }
            vision: { type: string }

  # ---------- リレーションエントリ（要素①） ----------
  relationshipEntry:
    type: object
    additionalProperties: false
    required: [context]
    properties:
      context: { $ref: "#/$defs/contextName" }
      relationship: { $ref: "#/$defs/relationshipPattern" }   # v1・任意
      roles:                                                  # 自 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      partnerRoles:                                           # 相手 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      note: { type: string }

  # ---------- 集約メタ（要素④・任意） ----------
  aggregateMeta:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      purpose: { type: string }
      states:
        type: array
        items: { $ref: "#/$defs/upperSnake" }

  # ---------- Context（BC 宣言） ----------
  context:
    type: object
    additionalProperties: false
    required: [name]                            # name のみ必須（language 無しの BC が実在）
    properties:
      name: { $ref: "#/$defs/contextName" }
      # --- 拡張メタ（要素④・任意） ---
      type: { $ref: "#/$defs/bcType" }
      vision: { type: string }
      responsibilities:                         # 文字列 or 文字列配列
        oneOf:
          - type: string
          - type: array
            items: { type: string }
      implementationTechnology: { type: string }
      subdomain: { $ref: "#/$defs/contextName" }   # 要素②・軽量参照
      aggregates:
        type: array
        items: { $ref: "#/$defs/aggregateMeta" }
      # --- v1 既存 ---
      language:
        type: object
        additionalProperties: { type: string }   # EnglishTerm -> 日本語定義
      module: { type: string }
      upstream:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      downstream:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      note: { type: string }

  # ---------- Rule / Error ----------
  rule:
    type: object
    additionalProperties: false
    required: [rule]
    properties:
      rule: { type: string }     # 英語の不変条件（自然文）
      why: { type: string }
      note: { type: string }
  error:
    type: object
    additionalProperties: false
    required: [condition, error]
    properties:
      condition: { type: string }
      error: { $ref: "#/$defs/pascalCase" }
      when: { type: string }
      note: { type: string }

  # ---------- Branch（要素③） ----------
  branch:
    type: object
    additionalProperties: false
    required: [evt]
    properties:
      condition: { type: string }    # concurrent / inclusive 時は省略可
      evt: { $ref: "#/$defs/pascalCase" }
      pol:
        oneOf:
          - { $ref: "#/$defs/pascalCase" }
          - type: array
            items: { $ref: "#/$defs/pascalCase" }
      note: { type: string }

  # ---------- Scenario ----------
  scenario:
    type: object
    additionalProperties: false
    required: [name, context, actor]
    properties:
      name: { type: string }                  # 日本語（アクター＋行為）
      context: { $ref: "#/$defs/contextName" }
      actor: { $ref: "#/$defs/pascalCase" }
      qry:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }
      evt: { $ref: "#/$defs/pascalCase" }
      branchMode: { $ref: "#/$defs/branchMode" }   # 要素③・省略時 exclusive
      branches:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/branch" }
      agg: { $ref: "#/$defs/pascalCase" }
      rules:
        type: array
        items: { $ref: "#/$defs/rule" }
      errors:
        type: array
        items: { $ref: "#/$defs/error" }
      pol:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      note: { type: string }
    allOf:
      - not:
          required: [evt, branches]            # evt と branches の同時指定を禁止
      - if:
          required: [branchMode]
        then:
          required: [branches]                 # branchMode 単独を禁止

  # ---------- Policy（EVENTUAL-TX） ----------
  policy:
    type: object
    additionalProperties: false
    required: [name, context]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      context: { $ref: "#/$defs/contextName" }
      trigger: { $ref: "#/$defs/pascalCase" }   # v1・単一トリガー
      triggers:                                  # 要素③・複数トリガー join
        type: object
        additionalProperties: false
        required: [events]
        properties:
          events:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/pascalCase" }
          mode: { $ref: "#/$defs/branchMode" }
      qry: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }        # 副作用専用 POLICY では省略可
      bulk: { type: boolean }
      evt: { $ref: "#/$defs/pascalCase" }
      note: { type: string }
    allOf:
      - not:
          required: [trigger, triggers]          # trigger と triggers の同時指定を禁止
      - if:
          required: [bulk]
          properties:
            bulk: { const: true }
        then:
          required: [qry]                        # bulk: true のとき qry 必須
