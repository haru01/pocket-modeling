# DML (Domain Modeling Language) JSON Schema — Draft 2020-12
#
# DML は YAML 形式のドメインモデル（ctxs / aggs / scs / pols の 4 リスト + 任意の domains）。
# v3 で AGG をトップレベル `aggs[]` に切り出した（旧 v2 の `ctxs[].aggs[]` 内 dict 形式は廃止）。
# このスキーマは「構文 validity（形が正しいか）」のみを機械検証する。
# 「意味 validity（参照の実在・因果整合・モデル品質）」は causal-check / quality-check が担う。
# スキーマ通過は必要条件であって十分条件ではない。
#
# 検証例:
#   import yaml; from jsonschema import Draft202012Validator
#   schema = yaml.safe_load(open(".../references/dml.schema.yaml"))
#   doc = yaml.safe_load(open("docs/eventstorming/<session>.dml.yaml"))  # None も許容
#   list(Draft202012Validator(schema).iter_errors(doc))
#
# 構造の要点:
#   - `ctxs[].aggs` は AGG 名の軽量名簿（PascalCase 文字列のリスト）
#   - 詳細はトップレベル `aggs[]` に集約: name / ctx（所属 BC）/ purpose / states /
#     transitions（from→to via cmd）/ attrs（ペイロード属性）/ events（emit する EVT 宣言）
#
# 拡張フィールド（type/vision/resp/sub/roles/prRoles/brMode/trgs/domains 等）はすべて optional。
# 進行中セッション（多くの項目が空）でも valid。
#
# 略語化方針: 長いキー名は略語化、短いキー名（name/type/vision/note/lang/mod/qry/cmd/evt/agg/pol 等）は維持。
# 主な略語: ctxs / scs / pols / ctx / aggs / sub(s) / up / dn / rel / prRoles / brMode / brs /
#          cond / err / errs / resp / tech / trg / trgs / evts / lang / mod / via

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pocket-modeling/schemas/dml.schema.yaml"
title: DML Document

# トップレベルは object。必須キーは無い（空 {} も valid）。
# 全行コメントのみの .dml.yaml は yaml.safe_load で None になるが、これは検証ツール層
# （validate_dml.py / ビルダー）が「未記述」として検証前にスキップする（進行中セッション許容）。
# スキーマを object に固定することで、違反が (root) に潰れず深いパス（例 scs/3/cmd）で報告される。
type: object
additionalProperties: false
properties:
  domains:
    type: array
    items: { $ref: "#/$defs/domain" }
  ctxs:
    type: array
    items: { $ref: "#/$defs/context" }
  aggs:
    type: array
    items: { $ref: "#/$defs/aggregate" }
  scs:
    type: array
    items: { $ref: "#/$defs/scenario" }
  pols:
    type: array
    items: { $ref: "#/$defs/policy" }

$defs:

  # ---------- 識別子パターン ----------
  contextName:
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"   # lowercase-with-hyphen
  pascalCase:
    type: string
    pattern: "^[A-Z][A-Za-z0-9]*$"             # cmd / evt / agg / qry / actor / error
  upperSnake:
    type: string
    pattern: "^[A-Z][A-Z0-9_]*$"               # AGG の状態名（DRAFT / PUBLISHED 等）

  # ---------- enum 群 ----------
  relationshipPattern:                          # 粗い relationship（既存 4 + CML 由来 4）
    type: string
    enum:
      - Customer-Supplier      # v1
      - Conformist             # v1
      - Shared-Kernel          # v1
      - ACL                    # v1
      - Partnership            # +CML
      - Upstream-Downstream    # +CML
      - Open-Host-Service      # +CML
      - Published-Language     # +CML
  relationshipRole:                             # CML ショートコード（roles / prRoles 要素）
    type: string
    enum: [U, D, S, C, OHS, PL, ACL, CF, SK, P]
  subdomainType:
    type: string
    enum: [CORE_DOMAIN, SUPPORTING_DOMAIN, GENERIC_SUBDOMAIN]
  bcType:
    type: string
    enum: [FEATURE, APPLICATION, SYSTEM, MICROSERVICE]
  branchMode:
    type: string
    enum: [exclusive, concurrent, inclusive]    # X / + / O

  # ---------- Domain / Subdomain（要素②・任意） ----------
  domain:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/contextName" }
      vision: { type: string }
      subs:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { $ref: "#/$defs/contextName" }
            type: { $ref: "#/$defs/subdomainType" }
            vision: { type: string }

  # ---------- リレーションエントリ（要素①） ----------
  relationshipEntry:
    type: object
    additionalProperties: false
    required: [ctx]
    properties:
      ctx: { $ref: "#/$defs/contextName" }
      rel: { $ref: "#/$defs/relationshipPattern" }            # v1・任意
      roles:                                                  # 自 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      prRoles:                                                # 相手 BC 側の役割パターン
        type: array
        items: { $ref: "#/$defs/relationshipRole" }
      note: { type: string }

  # ---------- 属性（AGG / EVT のペイロード要素） ----------
  attribute:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: "^[a-z][A-Za-z0-9]*$"        # camelCase（slug ではなくフィールド名）
      type: { type: string }                   # string / int / date / <AggName>Id 等（自由文字列）
      required: { type: boolean }
      note: { type: string }

  # ---------- 状態遷移 ----------
  transition:
    type: object
    additionalProperties: false
    required: [from, to, via]
    properties:
      from: { $ref: "#/$defs/upperSnake" }
      to:                                       # 単一 or 配列（分岐先）
        oneOf:
          - { $ref: "#/$defs/upperSnake" }
          - type: array
            items: { $ref: "#/$defs/upperSnake" }
      via: { $ref: "#/$defs/pascalCase" }       # トリガー CMD（scs[].cmd と一致）
      when: { type: string }                    # 日本語補足
      note: { type: string }

  # ---------- AGG が emit するイベント宣言 ----------
  eventMeta:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      params:
        type: array
        items: { $ref: "#/$defs/attribute" }
      note: { type: string }

  # ---------- Aggregate（トップレベル `aggs` の要素） ----------
  aggregate:
    type: object
    additionalProperties: false
    required: [name, ctx]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      ctx: { $ref: "#/$defs/contextName" }     # 所属 BC（必須・ctxs[].aggs と双方向参照）
      purpose: { type: string }
      states:
        type: array
        items: { $ref: "#/$defs/upperSnake" }
      transitions:
        type: array
        items: { $ref: "#/$defs/transition" }
      attrs:
        type: array
        items: { $ref: "#/$defs/attribute" }
      events:                                   # この AGG が emit する EVT 宣言
        type: array
        items: { $ref: "#/$defs/eventMeta" }
      note: { type: string }

  # ---------- Context（BC 宣言） ----------
  context:
    type: object
    additionalProperties: false
    required: [name]                            # name のみ必須（lang 無しの BC が実在）
    properties:
      name: { $ref: "#/$defs/contextName" }
      # --- 拡張メタ（要素④・任意） ---
      type: { $ref: "#/$defs/bcType" }
      vision: { type: string }
      resp:                                     # 文字列 or 文字列配列
        oneOf:
          - type: string
          - type: array
            items: { type: string }
      tech: { type: string }
      sub: { $ref: "#/$defs/contextName" }      # 要素②・軽量参照
      aggs:                                     # AGG 名の軽量名簿（詳細はトップレベル aggs[] へ）
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      # --- v1 既存 ---
      lang:
        type: object
        additionalProperties: { type: string }   # EnglishTerm -> 日本語定義
      mod: { type: string }
      up:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      dn:
        type: array
        items: { $ref: "#/$defs/relationshipEntry" }
      note: { type: string }

  # ---------- Rule / Error ----------
  rule:
    type: object
    additionalProperties: false
    required: [rule]
    properties:
      rule: { type: string }     # 英語の不変条件（自然文）
      why: { type: string }
      note: { type: string }
  error:
    type: object
    additionalProperties: false
    required: [cond, err]
    properties:
      cond: { type: string }
      err: { $ref: "#/$defs/pascalCase" }
      when: { type: string }
      note: { type: string }

  # ---------- Branch（要素③） ----------
  branch:
    type: object
    additionalProperties: false
    required: [evt]
    properties:
      cond: { type: string }         # concurrent / inclusive 時は省略可
      evt: { $ref: "#/$defs/pascalCase" }
      pol:
        oneOf:
          - { $ref: "#/$defs/pascalCase" }
          - type: array
            items: { $ref: "#/$defs/pascalCase" }
      note: { type: string }

  # ---------- Scenario ----------
  scenario:
    type: object
    additionalProperties: false
    required: [name, ctx, actor]
    properties:
      name: { type: string }                  # 日本語（アクター＋行為）
      ctx: { $ref: "#/$defs/contextName" }
      actor: { $ref: "#/$defs/pascalCase" }
      qry:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }
      evt: { $ref: "#/$defs/pascalCase" }
      brMode: { $ref: "#/$defs/branchMode" }   # 要素③・省略時 exclusive
      brs:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/branch" }
      agg: { $ref: "#/$defs/pascalCase" }
      rules:
        type: array
        items: { $ref: "#/$defs/rule" }
      errs:
        type: array
        items: { $ref: "#/$defs/error" }
      pol:
        type: array
        items: { $ref: "#/$defs/pascalCase" }
      note: { type: string }
    allOf:
      - not:
          required: [evt, brs]                  # evt と brs の同時指定を禁止
      - if:
          required: [brMode]
        then:
          required: [brs]                       # brMode 単独を禁止

  # ---------- Policy（EVENTUAL-TX） ----------
  policy:
    type: object
    additionalProperties: false
    required: [name, ctx]
    properties:
      name: { $ref: "#/$defs/pascalCase" }
      ctx: { $ref: "#/$defs/contextName" }
      trg: { $ref: "#/$defs/pascalCase" }       # v1・単一トリガー
      trgs:                                      # 要素③・複数トリガー join
        type: object
        additionalProperties: false
        required: [evts]
        properties:
          evts:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/pascalCase" }
          mode: { $ref: "#/$defs/branchMode" }
      qry: { $ref: "#/$defs/pascalCase" }
      cmd: { $ref: "#/$defs/pascalCase" }        # 副作用専用 POLICY では省略可
      bulk: { type: boolean }
      evt: { $ref: "#/$defs/pascalCase" }
      note: { type: string }
    allOf:
      - not:
          required: [trg, trgs]                  # trg と trgs の同時指定を禁止
      - if:
          required: [bulk]
          properties:
            bulk: { const: true }
        then:
          required: [qry]                        # bulk: true のとき qry 必須
