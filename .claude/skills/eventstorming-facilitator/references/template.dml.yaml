# =============================================================================
# DML テンプレート — 新規 EventStorming セッション
# =============================================================================
# `dmlctl init <file> --session-id=... --domain=...` がこのテンプレートから
# session 入りの空 DML を生成する。以降は dmlctl set/add/update で育てる。
#
# 全フィールドは optional。空 YAML（{} のみ）でも valid（進行中セッション許容）。
# HTML（dist/eventstorming/*.html）は本 YAML のみから自動生成される。
#
# 各フィールドの書き方の正典：
#   - 型・必須・enum      → references/dml.schema.yaml（書く前に `dmlctl hint --path=<a.b.c>`）
#   - 設計判断・記法哲学  → references/dml-spec.md
#   - 記入済みのフル例    → examples/sample.dml.yaml
# =============================================================================
#
# トップレベルフィールド一覧（記入順の目安 = フェーズ進行順）：
#
#   session:      # セッションメタ（id / domain / phase / status / goal / started_at）
#                 # phase の前進は `dmlctl advance` を使う（enum 検証つき）
#
#   narratives:   # 散文＋フロー起点。kind: happy は 1 本（400〜600 字）、
#                 # kind: alt は複数可（100〜200 字）。entry 指定で §2 フロー図を駆動
#
#   domains:      # サブドメイン分類（subs[].type: CORE/SUPPORTING/GENERIC_SUBDOMAIN）
#
#   contexts:     # BC 宣言。name / description（散文）/ lang（英→日辞書：
#                 # aggs/actors/cmds/evts/pols/qrys/vos）/ up / dn / aggs（AGG 名簿）
#
#   aggregates:   # AGG 詳細。name / ctx / purpose / background / constraints /
#                 # states / transitions / attrs / events
#                 # 生成 CMD は transitions に書かない（dml-spec「transitions[] の初期化規約」）
#
#   scenarios:    # CMD 実行ユースケース。name（日本語・アクター＋行為）/ ctx / actor /
#                 # cmd / evt|brs / agg / rules / errs / next（フロー連鎖）
#
#   policies:     # EVENTUAL-TX 専用。trg（単一）or trgs（join/OR）/ cmd / evt /
#                 # bulk（true なら qry 必須）/ within（遅延許容 SLA）
#
#   decisions:    # 意思決定ログ。topic / chosen / options[]（name/label/why/why_not）/ affects
#
#   questions:    # オープンクエスチョン（status: open|closed、closed は decision_id 必須）
#   actions:      # 次のアクション（done フラグで進捗管理。`dmlctl action` で更新）
#   queries:      # リードモデル候補（name / ctx / purpose / users / sources / formula)
#
# aggregates / policies / scenarios を足したら、所属 BC の contexts[].lang にも
# 英→日ラベルを同時登録する（漏れは language_coverage チェックが検出）。
# =============================================================================
{}
