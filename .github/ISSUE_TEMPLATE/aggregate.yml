name: "Aggregate (AGG) Epic"
description: "EventStorming で抽出された集約 Epic Issue (self-contained, 1 PR = AI エージェント 1 担当)"
title: "[bc:<bc-slug>][agg:<AggName>] <AggName> 集約（<日本語名>）"
labels: ["type:aggregate"]
body:
  - type: markdown
    attributes:
      value: |
        集約 (Aggregate) は **AI エージェント担当の単位** です。1 AGG = 1 self-contained Epic = 1 PR。
        CMD / QRY / 受信 POLICY / 発信 EVT の詳細は本 Issue 本文に inline で記述します（Sub-issue は持ちません）。
        詳細は `.claude/skills/eventstorming-to-issues/references/issue-templates.md` を参照。
  - type: textarea
    id: scope
    attributes:
      label: "実装担当範囲"
      description: |
        - BC (大項目): bc:<bc-slug>
        - AGG (中項目): agg:<AggName>
        - スコープ: この AGG の全 CMD / QRY / 受信 POLICY を 1 PR で実装
        - 1 AGG = 1 オーナー = 1 PR (AI エージェント 1 担当)
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: "Aggregate 概要"
      description: "ライフサイクル・責務・ユビキタス言語上の意味"
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: "スキーマ (Zod)"
      description: "AGG の属性スキーマを TypeScript / Zod で記述"
      render: typescript
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: "不変条件 (RULE)"
      description: "- で始まる箇条書き"
  - type: textarea
    id: errors
    attributes:
      label: "エラー (ERR)"
      description: "- で始まる箇条書き、ErrName: 説明 の形式"
  - type: textarea
    id: state-diagram
    attributes:
      label: "状態遷移 (State Transitions)"
      description: "Mermaid stateDiagram-v2"
      render: mermaid
  - type: textarea
    id: state-cmds-list
    attributes:
      label: "状態遷移を起こす CMD（一覧）"
      description: "Markdown テーブル: from / to / CMD / RULE"
  - type: textarea
    id: state-cmds-detail
    attributes:
      label: "状態遷移を起こす CMD（詳細）"
      description: "各 CMD のアクター・発火 EVT・適用 RULE・想定 ERR・連鎖 POLICY を inline で"
  - type: textarea
    id: attr-cmds-list
    attributes:
      label: "状態を変えない CMD（属性更新・一覧）"
  - type: textarea
    id: attr-cmds-detail
    attributes:
      label: "状態を変えない CMD（詳細）"
  - type: textarea
    id: queries
    attributes:
      label: "QRY（読み出し口・詳細）"
  - type: textarea
    id: inbound-policies
    attributes:
      label: "受信 POLICY (inbound)"
      description: "他 AGG / BC の EVT に反応してこの AGG の CMD を発火。cross-BC は明示マーキング"
  - type: textarea
    id: outbound-events
    attributes:
      label: "発信イベント (outbound)"
      description: "この AGG が発火する EVT とその消費先 POLICY"
  - type: textarea
    id: module-structure
    attributes:
      label: "推奨モジュール構造"
      description: "実装ファイル/ディレクトリ構成の提案（AI 実装の足場）"
  - type: textarea
    id: acceptance
    attributes:
      label: "受け入れ条件"
      description: "集約レベルのチェックリスト（スキーマ一致・状態遷移網羅・RULE/ERR enforce・POLICY 冪等性・etc）"
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: "AGG 跨ぎ統合 Issue への参加"
      description: "この AGG が参加する integration/<scenario>.md / Issue #N をリンク"
  - type: textarea
    id: depends-on
    attributes:
      label: "Depends on"
      description: "上流 BC、受信 POLICY 発生元 AGG、参加する統合 Issue 等"
