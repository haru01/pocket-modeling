name: "Scenario (AGG 跨ぎ統合) / Saga"
description: "複数 AGG または BC を跨ぐシナリオ・Saga。隠れ依存の単一窓口"
title: "[bc:<bc-list>][agg:<agg-list>] <ScenarioName>"
labels: ["type:scenario", "cross-bc"]
body:
  - type: markdown
    attributes:
      value: |
        **AGG 跨ぎ統合 Issue** または **Cross-BC Saga**。
        この Issue は「複数の AGG / BC を巻き込むため、単一 AGG Epic に閉じない」もの。
        構成 CMD / POLICY の詳細は **参加 AGG Epic 本文に inline** されている。
        本 Issue は参加 AGG Epic を束ねて E2E フローと整合性を保証する。
        Saga の場合は `type:saga` ラベルに差し替え。
  - type: textarea
    id: bcs
    attributes:
      label: "関係する BC"
      description: "- `bc:xxx` 形式で複数列挙"
      placeholder: |
        - `bc:registration`
        - `bc:payment`
    validations:
      required: true
  - type: textarea
    id: aggregates
    attributes:
      label: "関係する集約"
      description: "- `agg:Xxx` (Epic: #N) の形式"
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: "概要"
      description: "業務プロセスとしての説明"
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: "フロー"
      description: "Mermaid sequence など"
      render: mermaid
  - type: textarea
    id: components
    attributes:
      label: "構成要素"
      description: "AGG 間連携の起点 CMD と EVT 連鎖。詳細仕様は参加 AGG Epic の本文に inline"
  - type: textarea
    id: compensation
    attributes:
      label: "失敗時の補償（Saga のみ）"
  - type: textarea
    id: acceptance
    attributes:
      label: "受け入れ条件"
      value: |
        - [ ] 全 CMD が成功時に正しい順序で発火される
        - [ ] 部分失敗時の整合性が保たれる（補償トランザクション or eventual consistency）
        - [ ] 参加 AGG Epic 完了後の E2E テストでフロー検証
  - type: textarea
    id: prerequisites
    attributes:
      label: "前提"
      value: |
        - 関係する AGG Epic がすべて完了済み
  - type: textarea
    id: depends-on
    attributes:
      label: "Depends on"
      description: "参加 AGG Epic を #N 形式で全てリンク（CMD/POLICY 詳細は各 Epic 本文に inline）"
